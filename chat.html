<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>聊天 · 舒心市</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            height: 100%;
            font-family: -apple-system, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
            background: #ededed;
            color: #1a1a1a;
            overflow: hidden;
            touch-action: manipulation;
        }

        .app {
            max-width: 430px;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            margin: 0 auto;
            background: #ededed;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            padding-top: 30px;
            padding-bottom: 50px;
        }

        .chat-header {
            display: flex;
            align-items: center;
            padding: 8px 10px 8px 6px;
            background: #ffffff;
            border-bottom: 0.5px solid #d9d9d9;
            flex-shrink: 0;
            min-height: 50px;
        }

        .chat-header .back {
            font-size: 24px;
            color: #3a7bd5;
            cursor: pointer;
            padding: 0 4px;
            line-height: 1;
            border: none;
            background: none;
            font-family: inherit;
        }

        .chat-header .back:active {
            opacity: 0.5;
        }

        .chat-header .avatar {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            background: #e8e8e8;
            border: 1px solid #d9d9d9;
            margin: 0 8px;
            flex-shrink: 0;
            overflow: hidden;
        }

        .chat-header .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        .chat-header .info {
            flex: 1;
            min-width: 0;
        }

        .chat-header .info .name {
            font-size: 16px;
            font-weight: 500;
            color: #1a1a1a;
        }

        .chat-header .info .status {
            font-size: 11px;
            color: #8e8e93;
        }

        .chat-header .info .status.online {
            color: #4ade80;
        }

        .menu-wrapper {
            position: relative;
            flex-shrink: 0;
        }

        .menu-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background: transparent;
            color: #8e8e93;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: inherit;
        }

        .menu-btn:active {
            background: #f0f0f0;
        }

        .menu-dropdown {
            position: absolute;
            right: 0;
            top: 40px;
            background: #ffffff;
            border: 0.5px solid #d9d9d9;
            border-radius: 12px;
            padding: 4px 0;
            min-width: 180px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.12);
            display: none;
            z-index: 100;
            overflow: hidden;
        }

        .menu-dropdown.open {
            display: block;
        }

        .menu-dropdown .item {
            padding: 10px 16px;
            font-size: 13px;
            color: #1a1a1a;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            border: none;
            background: transparent;
            width: 100%;
            text-align: left;
            font-family: inherit;
        }

        .menu-dropdown .item:active {
            background: #f5f5f5;
        }

        .menu-dropdown .item .icon {
            font-size: 16px;
            width: 24px;
            text-align: center;
        }

        .menu-dropdown .item.danger {
            color: #ff3b30;
        }

        .menu-dropdown .item.danger:active {
            background: #fce4ec;
        }

        .menu-dropdown .divider {
            height: 0.5px;
            background: #f0f0f0;
            margin: 4px 12px;
        }

        /* ===== 故事面板 ===== */
        .story-panel {
            background: linear-gradient(180deg, #1a2030 0%, #141a24 100%);
            border-top: 1px solid #2a3344;
            padding: 6px 12px;
            flex-shrink: 0;
            font-size: 11px;
            display: none;
        }

        .story-panel.active {
            display: block;
        }

        .story-panel-header {
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
            overflow-x: auto;
        }

        .story-panel-title {
            font-size: 12px;
            font-weight: 600;
            color: #3a7bd5;
            display: flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
        }

        .story-panel-progress {
            font-size: 10px;
            color: #7a8aa3;
            padding: 1px 6px;
            border-radius: 8px;
            background: #1a2538;
            flex-shrink: 0;
        }

        .story-panel-progress.investigating {
            color: #ffb74d;
        }

        .story-panel-progress.reasoning {
            color: #ba68c8;
        }

        .story-panel-progress.intro {
            color: #4fc3f7;
        }

        .story-panel-progress.concluded {
            color: #81c784;
        }

        .story-info-inline {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
            cursor: pointer;
        }

        .story-actions {
            display: flex;
            align-items: center;
            gap: 4px;
            margin-left: auto;
            flex-shrink: 0;
        }

        .story-action-btn {
            font-size: 10px;
            color: #a0b3cc;
            background: #1a2538;
            border: 1px solid #2a3344;
            border-radius: 4px;
            cursor: pointer;
            padding: 2px 8px;
            font-family: inherit;
            transition: all 0.15s;
        }

        .story-action-btn:hover {
            background: #2a3548;
            color: #edf2f7;
            border-color: #3a4558;
        }

        .story-action-btn.clue {
            color: #4fc3f7;
            border-color: #2b5ca8;
        }

        .story-action-btn.clue:hover {
            background: #1a3a4a;
        }

        .story-action-btn.exit {
            color: #81c784;
            border-color: #3f8d5e;
        }

        .story-action-btn.exit:hover {
            background: #1a3a28;
        }

        .story-action-btn.switch {
            color: #ffb74d;
            border-color: #8d6e3f;
        }

        .story-action-btn.switch:hover {
            background: #3a2a1a;
        }

        /* ===== 故事引导提示条 ===== */
        .story-hint-bar {
            display: none;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            background: linear-gradient(90deg, #1a3a4a, #1a2538);
            border-top: 1px solid #2a3344;
            border-bottom: 1px solid #2a3344;
            color: #4fc3f7;
            font-size: 12px;
            cursor: pointer;
            flex-shrink: 0;
        }

        .story-hint-bar.active {
            display: flex !important;
        }

        .story-hint-bar .hint-icon {
            font-size: 14px;
        }

        .story-hint-bar .hint-text {
            flex: 1;
            color: #a0b3cc;
        }

        .story-hint-bar .hint-text b {
            color: #4fc3f7;
        }

        .story-hint-bar .hint-action {
            color: #3a7bd5;
            padding: 2px 8px;
            border: 1px solid #2b5ca8;
            border-radius: 10px;
            background: rgba(58, 123, 213, 0.1);
            cursor: pointer;
            font-size: 12px;
            font-family: inherit;
        }

        .message-area {
            flex: 1;
            overflow-y: auto;
            padding: 12px 14px 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            background: #ededed;
        }

        .message-area::-webkit-scrollbar {
            width: 0;
            display: none;
        }

        .clear-hint {
            text-align: center;
            padding: 30px 20px;
            color: #8e8e93;
            font-size: 14px;
        }

        .clear-hint .icon {
            font-size: 32px;
            display: block;
            margin-bottom: 8px;
        }

        .message {
            max-width: 82%;
            padding: 10px 14px;
            border-radius: 16px;
            font-size: 17px;
            line-height: 1.5;
            word-break: break-word;
            animation: fadeIn 0.2s ease;
            position: relative;
        }

        @keyframes fadeIn {
            0% {
                opacity: 0;
                transform: translateY(6px);
            }

            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            align-self: flex-end;
            background: #3a7bd5;
            color: #fff;
            border-bottom-right-radius: 4px;
        }

        .message.bot {
            align-self: flex-start;
            background: #ffffff;
            color: #1a1a1a;
            border-bottom-left-radius: 4px;
            border: 0.5px solid #e8e8e8;
        }

        .message.bot .bav {
            display: inline-block;
            margin-right: 4px;
            font-size: 15px;
        }

        .message .time {
            font-size: 10px;
            opacity: 0.5;
            margin-top: 4px;
            display: block;
            text-align: right;
        }

        .message.user .time {
            color: rgba(255, 255, 255, 0.6);
        }

        .message .msg-image {
            max-width: 100%;
            max-height: 240px;
            border-radius: 8px;
            display: block;
            margin-top: 4px;
        }

        .message .img-ph {
            padding: 16px 12px;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.04);
            border: 0.5px dashed #d9d9d9;
            font-size: 11px;
            color: #8e8e93;
            text-align: center;
            margin-top: 4px;
        }

        .audio-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 12px;
            background: #f5f5f5;
            border-radius: 10px;
            cursor: pointer;
            user-select: none;
            margin-top: 4px;
            min-width: 120px;
        }

        .audio-wrapper .disc {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, #ddd 0%, #bbb 25%, #ddd 50%, #bbb 75%, #ddd 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: transform 0.3s;
        }

        .audio-wrapper .disc.playing {
            animation: spin 2s linear infinite;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        .audio-wrapper .disc::after {
            content: '';
            width: 8px;
            height: 8px;
            background: #3a7bd5;
            border-radius: 50%;
        }

        .audio-wrapper .info {
            flex: 1;
        }

        .audio-wrapper .label {
            font-size: 12px;
            font-weight: 500;
        }

        .audio-wrapper .duration {
            font-size: 10px;
            color: #8e8e93;
        }

        .message.bot.typing {
            min-width: 70px;
            padding: 14px 20px;
        }

        .typing-dots {
            display: inline-flex;
            gap: 5px;
            padding: 2px 0;
        }

        .typing-dots span {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #8e8e93;
            animation: blink 1.4s infinite;
        }

        .typing-dots span:nth-child(2) {
            animation-delay: 0.18s;
        }

        .typing-dots span:nth-child(3) {
            animation-delay: 0.36s;
        }

        @keyframes blink {

            0%,
            60%,
            100% {
                opacity: 0.2;
                transform: scale(0.8);
            }

            30% {
                opacity: 1;
                transform: scale(1);
            }
        }

        .cursor-blink {
            display: inline-block;
            width: 2px;
            height: 18px;
            background: #3a7bd5;
            animation: blink-cursor 0.8s step-end infinite;
            vertical-align: text-bottom;
            margin-left: 2px;
        }

        @keyframes blink-cursor {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0;
            }
        }

        .input-area {
            display: flex;
            gap: 8px;
            padding: 8px 12px 14px;
            border-top: 0.5px solid #d9d9d9;
            background: #ffffff;
            flex-shrink: 0;
            align-items: flex-end;
        }

        .input-area textarea {
            flex: 1;
            background: #f5f5f5;
            border: 0.5px solid #e0e0e0;
            border-radius: 20px;
            padding: 10px 14px;
            font-size: 17px;
            color: #1a1a1a;
            resize: none;
            height: 42px;
            max-height: 80px;
            font-family: inherit;
            line-height: 1.4;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-area textarea:focus {
            border-color: #3a7bd5;
            background: #ffffff;
        }

        .input-area textarea::placeholder {
            color: #b0b0b0;
        }

        .input-area textarea:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .input-area button {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: none;
            background: #3a7bd5;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            flex-shrink: 0;
            transition: background 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .input-area button:active {
            transform: scale(0.92);
        }

        .input-area button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.75);
            color: #fff;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 13px;
            z-index: 200;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            font-family: -apple-system, "PingFang SC", sans-serif;
        }

        .toast.show {
            opacity: 1;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            display: none;
            align-items: flex-start;
            justify-content: center;
            z-index: 150;
            padding: 60px 20px 20px;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal {
            background: #ffffff;
            border-radius: 14px;
            padding: 20px;
            width: 100%;
            max-width: 380px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
        }

        .modal .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .modal .modal-header h3 {
            font-size: 16px;
            font-weight: 600;
            color: #1a1a1a;
        }

        .modal .modal-header .close {
            font-size: 20px;
            color: #8e8e93;
            cursor: pointer;
            border: none;
            background: none;
            font-family: inherit;
        }

        .modal .search-input {
            width: 100%;
            padding: 10px 14px;
            border: 0.5px solid #d9d9d9;
            border-radius: 10px;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            margin-bottom: 12px;
        }

        .modal .search-input:focus {
            border-color: #3a7bd5;
        }

        .modal .search-results {
            flex: 1;
            overflow-y: auto;
            max-height: 300px;
        }

        .modal .search-results::-webkit-scrollbar {
            width: 0;
            display: none;
        }

        .modal .result-item {
            padding: 8px 12px;
            border-bottom: 0.5px solid #f0f0f0;
            cursor: pointer;
            border-radius: 6px;
        }

        .modal .result-item:active {
            background: #f5f5f5;
        }

        .modal .result-item .who {
            font-size: 12px;
            font-weight: 500;
            color: #1a1a1a;
        }

        .modal .result-item .when {
            font-size: 10px;
            color: #8e8e93;
            margin-left: 8px;
        }

        .modal .result-item .text {
            font-size: 13px;
            color: #333;
            margin-top: 2px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .modal .result-item .text b {
            color: #3a7bd5;
        }

        .modal .no-result {
            padding: 20px;
            text-align: center;
            color: #8e8e93;
            font-size: 13px;
        }

        .modal .pwd-input {
            width: 100%;
            padding: 10px 14px;
            border: 0.5px solid #d9d9d9;
            border-radius: 10px;
            font-size: 16px;
            text-align: center;
            letter-spacing: 6px;
            font-family: inherit;
            outline: none;
            margin-bottom: 12px;
        }

        .modal .pwd-input:focus {
            border-color: #3a7bd5;
        }

        .modal .modal-actions {
            display: flex;
            gap: 10px;
        }

        .modal .modal-actions button {
            flex: 1;
            padding: 10px;
            border-radius: 10px;
            border: none;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            font-family: inherit;
        }

        .modal .modal-actions .btn-cancel {
            background: #f5f5f5;
            color: #666;
        }

        .modal .modal-actions .btn-cancel:active {
            background: #e8e8e8;
        }

        .modal .modal-actions .btn-confirm {
            background: #ff3b30;
            color: #fff;
        }

        .modal .modal-actions .btn-confirm:active {
            background: #d63031;
        }

        .modal .modal-actions .btn-primary {
            background: #3a7bd5;
            color: #fff;
        }

        .modal .modal-actions .btn-primary:active {
            background: #2b5ca8;
        }
    </style>
</head>

<body>

    <div class="app">
        <div class="chat-header">
            <button class="back" onclick="goBack()">‹</button>
            <div class="avatar" id="chatAvatar"></div>
            <div class="info">
                <div class="name" id="chatName">甜小朵</div>
                <div class="status online" id="chatStatus">🟢 在线 · 上班中</div>
            </div>
            <div class="menu-wrapper">
                <button class="menu-btn" id="menuBtn">⋯</button>
                <div class="menu-dropdown" id="menuDropdown">
                    <button class="item" data-action="search"><span class="icon">🔍</span>搜索聊天记录</button>
                    <button class="item" data-action="clearscreen"><span class="icon">🧹</span>清屏</button>
                    <button class="item" data-action="restorescreen"><span class="icon">↩️</span>恢复清屏</button>
                    <div class="divider"></div>
                    <button class="item danger" data-action="clear"><span class="icon">🗑️</span>清除全部聊天记录</button>
                </div>
            </div>
        </div>

        <!-- ===== 故事引导提示条（小舒专用） ===== -->
        <div class="story-hint-bar" id="storyHintBar">
            <span class="hint-icon">🔔</span>
            <span class="hint-text">朋友～ <b>有个新鲜事你要不要听听？</b> 我手头有些好故事...</span>
            <button class="hint-action" id="storyHintBtn">想听</button>
        </div>

        <!-- ===== 故事面板（小舒专用） ===== -->
        <div class="story-panel" id="storyPanel">
            <div class="story-panel-header">
                <div class="story-panel-title">
                    <span>🔍</span>
                    <span id="storyPanelTitle">案件调查中</span>
                </div>
                <span class="story-panel-progress intro" id="storyPanelProgress">开场</span>
                <div class="story-info-inline" id="storyClueInfo" onclick="showCluesModal()">
                    <span>📌</span>
                    <span id="storyClueCount" style="color:#4fc3f7;">0</span>
                </div>
                <div class="story-actions">
                    <button class="story-action-btn clue" id="storyClueBtn">📌线索</button>
                    <button class="story-action-btn switch" id="storySwitchBtn">🔄换一个</button>
                    <button class="story-action-btn exit" id="storyExitBtn">💾存档退出</button>
                </div>
            </div>
        </div>

        <!-- ===== 消息区域 ===== -->
        <div class="message-area" id="messageArea"></div>

        <div class="input-area">
            <textarea id="inputBox" rows="1" placeholder="输入消息…"></textarea>
            <button id="sendBtn">➤</button>
        </div>

        <div class="toast" id="toast"></div>

        <div class="modal-overlay" id="modalOverlay">
            <div class="modal" id="modalContent"></div>
        </div>
    </div>

    <script>
        // ================================================================
        //  chat.html · 完整版
        //  功能：固定一周排班 · DeepSeek API · 流式输出 · 关键词触发
        //        小舒故事系统 · 牌堆机制 · 存档退出 · 线索弹窗
        // ================================================================

        // ===== 0. 获取 URL 参数 =====
        function getParam(name) {
            const url = new URL(window.location.href);
            return url.searchParams.get(name) || 'a';
        }
        const SLOT = getParam('slot') || 'a';
        console.log('🔍 SLOT:', SLOT);

        // ===== 获取头像路径 =====
        function getAvatarPath() {
            const slot = (SLOT && SLOT !== 'undefined') ? SLOT : 'a';
            return './' + slot + '/img/other/avatar.jpg';
        }

        // ================================================================
        //  第一部分：基础数据
        // ================================================================

        const PERSONAS = {
            a: { name: '甜小朵', emoji: '🌸', tag: '🏥 护士', status: '🟢 在线 · 上班中', cls: 'online' },

        function getTimeInfo() {
            const now = new Date();
            const year = now.getFullYear(),
                month = now.getMonth() + 1,
                day = now.getDate();
            const hour = now.getHours(),
                minute = now.getMinutes(),
                second = now.getSeconds();
            const weekday = now.getDay();
            const weekdays = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
            const dateKey = String(month).padStart(2, '0') + '-' + String(day).padStart(2, '0');
            const seasons = [{ name: '春', months: [3, 4, 5] }, { name: '夏', months: [6, 7, 8] }, { name: '秋', months: [9, 10, 11] }, { name: '冬', months: [12, 1, 2] }];
            const season = (seasons.find(s => s.months.includes(month)) || {}).name || '冬';
            const ampm = hour < 12 ? '上午' : '下午';
            const term = SOLAR_TERMS[dateKey] || null;
            const yearMap = buildYearHolidayMap(year);
            let holidaysToday = (yearMap[dateKey] && yearMap[dateKey].length) ? [...yearMap[dateKey]] : null;
            const isUserBirthday = !!(holidaysToday && holidaysToday.includes('男朋友生日'));
            if (isUserBirthday) { holidaysToday = ['男朋友生日', ...holidaysToday.filter(n => n !== '男朋友生日')]; }
            const holiday = holidaysToday ? holidaysToday.join('、') : null;
            return {
                now, year, month, day, hour, minute, second, weekday: weekdays[weekday], ampm, dateKey, season, term,
                holiday, holidaysToday, isUserBirthday, isWeekend: weekday === 0 || weekday === 6
            };
        }

        function buildYearHolidayMap(year) {
            const map = {};
            const addHoliday = (k, n) => {
                if (!map[k]) map[k] = [];
                if (!map[k].includes(n)) map[k].push(n);
            };
            for (const [k, v] of Object.entries(HOLIDAYS_FIXED)) addHoliday(k, v);
            const lunar = LUNAR_HOLIDAYS[year] || LUNAR_HOLIDAYS[2026];
            for (const [n, k] of Object.entries(lunar)) addHoliday(k, n);
            for (const [k, n] of Object.entries(SOLAR_TERMS)) {
                if (['清明', '冬至', '立春', '立夏', '立秋', '立冬'].includes(n)) addHoliday(k, n + '节气');
            }
            const userBDMap = { 2024: '11-26', 2025: '12-16', 2026: '12-05' };
            const bd = userBDMap[year];
            if (bd) addHoliday(bd, '男朋友生日');
            return map;
        }

        const cardPiles = {};

        function shuffle(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function getCardPile(slot, type) {
            const key = slot + '_' + type;
            if (!cardPiles[key]) {
                let files = [];
                const manifest = window.assetManifest;
                if (manifest && manifest.slots && manifest.slots[slot]) {
                    if (type === 'work') {
                        files = manifest.slots[slot].img.work || [];
                    } else if (type === 'private') {
                        files = manifest.slots[slot].img.private || [];
                    }
                }
                if (files.length === 0) {
                    const fallbackCount = { a: 30, b: 30, c: 33, d: 0 };
                    const count = fallbackCount[slot] || 5;
                    for (let i = 1; i <= count; i++) {
                        files.push(i + '.jpg');
                    }
                }
                cardPiles[key] = {
                    deck: shuffle(files),
                    discard: []
                };
                console.log('🃏 创建牌堆:', key, '共', files.length, '张');
            }
            return cardPiles[key];
        }

        function drawImage(slot, type) {
            const pile = getCardPile(slot, type);
            if (pile.deck.length === 0) {
                if (pile.discard.length === 0) {
                    console.warn('⚠️ 没有图片可抽');
                    return null;
                }
                pile.deck = shuffle(pile.discard);
                pile.discard = [];
                console.log('🔄 牌堆已重置（所有图片已发完）');
            }
            const file = pile.deck.pop();
            pile.discard.push(file);
            return './' + slot + '/img/' + type + '/' + file;
        }

            if (kt.normal_audio && kt.normal_audio.keywords) {
                const na = kt.normal_audio;
                for (const kw of na.keywords) {
                    if (text.includes(kw) && Math.random() < (na.probability || 0.5)) {
                        return { type: 'audio', content: '__tts__' };

            if (kt.hidden_photo && Array.isArray(kt.hidden_photo)) {

            prompt += `\n明天（${tomorrow.getMonth() + 1}月${tomorrow.getDate()}日 ${weekdays[tomorrow.getDay()]}）：${getScheduleDescription(PERSONA_ID, tomorrow)}`;
            prompt += `\n后天（${dayAfter.getMonth() + 1}月${dayAfter.getDate()}日 ${weekdays[dayAfter.getDay()]}）：${getScheduleDescription(PERSONA_ID, dayAfter)}`;

            if (timeInfo.term) prompt += `\n今日节气：${timeInfo.term}`;

                else prompt += `\n当前${WEATHER_CITY}的天气：${weather.condition}，${weather.temperature}`;
            }

            prompt += `\n\n你（${current.name}）称呼用户为「${profileData?.personality?.call_user || '宝贝'}」，自称「${profileData?.personality?.self_call || '我'}」。`;

            prompt += `\n1. 上述「📅 日期信息」中已经注明了你今天的真实排班，你必须严格按照这个信息回答关于排班、上班、下班的问题。`;
            prompt += `\n2. 绝对禁止自己编造排班信息！如果用户问你今天上什么班，你必须直接引用上面「今天」后面的排班描述。`;

        function getContextMessages() {
            const MAX_CONTEXT = 60;
            const recent = messages.slice(-MAX_CONTEXT);
            return recent.filter(msg => msg.type === 'text' || msg.type === undefined);

        async function callDeepSeekStream(userText, onChunk, onComplete, onError) {
            const apiKey = localStorage.getItem('ai_api_key');
            if (!apiKey) {
                onError('请先配置 DeepSeek API Key（在「我的」→ API 配置中设置）');
                return;
            }

            let weather = null;
            if (/天气|温度|热|冷|下雨|雨|雪|风|出门|穿衣|预报|晴|阴/.test(userText)) {
                try { weather = await fetchWeather(); } catch (e) { }
            }

            const prompt = buildSystemPrompt(userText, weather);
            const context = getContextMessages();

            const messagesArr = [
                { role: 'system', content: prompt },
                ...context.map(msg => ({
                    role: msg.role === 'user' ? 'user' : 'assistant',
                    content: msg.text || msg.content || ''
                })),
                { role: 'user', content: userText }
            ];

            try {
                const resp = await fetch('https://api.deepseek.com/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + apiKey
                    },
                    body: JSON.stringify({
                        model: 'deepseek-chat',
                        messages: messagesArr,
                        max_tokens: 400,
                        temperature: 0.85,
                        stream: true
                    })
                });

                if (!resp.ok) {
                    const errText = await resp.text();
                    onError('API 错误：' + resp.status + ' ' + errText);
                    return;
                }

                const reader = resp.body.getReader();
                const decoder = new TextDecoder();
                let fullText = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    const chunk = decoder.decode(value);
                    const lines = chunk.split('\n').filter(line => line.trim() !== '');
                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            const data = line.slice(6);
                            if (data === '[DONE]') continue;
                            try {
                                const parsed = JSON.parse(data);
                                const delta = parsed.choices?.[0]?.delta?.content;
                                if (delta) {
                                    fullText += delta;
                                    onChunk(delta);
                                }
                            } catch (e) { }
                        }
                    }
                }

                onComplete(fullText);
            } catch (e) {
                onError('网络错误：' + e.message);
            }
        }

        function getTime() {
            return new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
        }

        function formatTime(timestamp) {
            if (!timestamp) return getTime();
            const d = new Date(timestamp);
            if (isNaN(d.getTime())) return getTime();
            const now = new Date();
            const sameDay = d.getFullYear() === now.getFullYear() &&
                d.getMonth() === now.getMonth() &&
                d.getDate() === now.getDate();
            if (sameDay) {
                return d.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
            }
            const yesterday = new Date(now);
            yesterday.setDate(yesterday.getDate() - 1);
            const isYesterday = d.getFullYear() === yesterday.getFullYear() &&
                d.getMonth() === yesterday.getMonth() &&
                d.getDate() === yesterday.getDate();
            const hhmm = d.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
            if (isYesterday) return '昨天 ' + hhmm;
            return d.toLocaleDateString('zh-CN', { month: '2-digit', day: '2-digit' }) + ' ' + hhmm;
        }

        function createAudioUI(src, duration) {
            const wrapper = document.createElement('div');
            wrapper.className = 'audio-wrapper';
            const disc = document.createElement('div');
            disc.className = 'disc';
            const info = document.createElement('div');
            info.className = 'info';
            const label = document.createElement('div');
            label.className = 'label';
            label.textContent = '语音消息';
            const durSpan = document.createElement('div');
            durSpan.className = 'duration';
            durSpan.textContent = duration ? Math.round(duration) + '"' : '…';
            info.appendChild(label);
            info.appendChild(durSpan);
            wrapper.appendChild(disc);
            wrapper.appendChild(info);

            if (src === '__audio_placeholder__' || src === '__tts__') {
                wrapper.style.opacity = '0.5';
                wrapper.style.cursor = 'not-allowed';
                durSpan.textContent = '需配置TTS';
                wrapper.onclick = () => showToast('请先配置 TTS API Key');
                return wrapper.outerHTML;
            }

            const audio = new Audio();
            audio.src = src;
            audio.preload = 'metadata';
            let isPlaying = false;

            audio.addEventListener('loadedmetadata', () => {
                if (audio.duration && audio.duration > 0) {
                    durSpan.textContent = Math.round(audio.duration) + '"';
                }
            });

            wrapper.onclick = function (e) {
                e.stopPropagation();
                if (currentAudio && currentAudio !== audio) {
                    currentAudio.pause();
                    const oldDisc = currentAudio._wrapper?.querySelector('.disc');
                    if (oldDisc) oldDisc.classList.remove('playing');
                }
                if (isPlaying) {
                    audio.pause();
                } else {
                    audio.currentTime = 0;
                    audio.play().catch(() => { });
                    disc.classList.add('playing');
                    label.textContent = '播放中...';
                }
            };

            audio.addEventListener('play', () => {
                isPlaying = true;
                currentAudio = audio;
                audio._wrapper = wrapper;
            });
            audio.addEventListener('pause', () => {
                isPlaying = false;
                disc.classList.remove('playing');
                label.textContent = '语音消息';
                if (currentAudio === audio) currentAudio = null;
            });
            audio.addEventListener('ended', () => {
                isPlaying = false;
                disc.classList.remove('playing');
                label.textContent = '语音消息';
                if (currentAudio === audio) currentAudio = null;
            });

            return wrapper.outerHTML;
        }

        async function sendMessage() {
            updateHeaderStatus();
            const input = document.getElementById('inputBox');
            const text = input.value.trim();
            if (!text) return;
            if (isWaiting) { showToast('⏳ 正在回复中，请稍候'); return; }

            // ==========================================================
            //  0. 故事系统关键词（小舒专用 · 最高优先级）
            // ==========================================================
            if (SLOT === 'd' && window.storyEngine) {
                const lowerText = text.toLowerCase();

                // --- 0a. 退出关键词 → 存档退出 ---
                if (/退出|不听了|结束|算了|不想听了|停止/.test(lowerText)) {
                    if (window.storyEngine.isActive()) {
                        const data = window.storyEngine.storyData;
                        if (data) {
                            localStorage.setItem('story_save_' + data.storyId, JSON.stringify(data));
                            addMessage('bot', { type: 'text', text: '💾 故事已存档，下次再继续听吧～' });
                        }
                        window.storyEngine.endStory();
                        const panel = document.getElementById('storyPanel');
                        if (panel) {
                            panel.style.display = 'none';
                            panel.classList.remove('active');
                        }
                        const bar = document.getElementById('storyHintBar');
                        if (bar) {
                            bar.style.display = 'flex';
                            bar.classList.add('active');
                        }
                        console.log('✅ 故事已存档退出');
                    } else {
                        addMessage('bot', { type: 'text', text: '没有进行中的故事呢～' });
                    }
                    input.value = '';
                    input.style.height = '42px';
                    scrollToBottom();
                    return;
                }

                // --- 0b. 换一个关键词 → 存档并换下一个 ---
                if (/换一个|下一个|下一本|换个故事|换故事/.test(lowerText)) {
                    if (window.storyEngine.isActive()) {
                        const data = window.storyEngine.storyData;
                        if (data) {
                            localStorage.setItem('story_save_' + data.storyId, JSON.stringify(data));
                        }
                        window.storyEngine.endStory();
                        const panel = document.getElementById('storyPanel');
                        if (panel) {
                            panel.style.display = 'none';
                            panel.classList.remove('active');
                        }
                        addMessage('bot', { type: 'text', text: '📖 好的，换个故事...' });
                        setTimeout(() => startRandomStory(), 500);
                    } else {
                        // 没有故事进行，直接开始一个
                        addMessage('bot', { type: 'text', text: '📖 好的，找个好故事...' });
                        setTimeout(() => startRandomStory(), 300);
                    }
                    input.value = '';
                    input.style.height = '42px';
                    scrollToBottom();
                    return;
                }

                // --- 0c. 触发故事关键词（没有故事进行时） ---
                if (!window.storyEngine.isActive()) {
                    const triggerWords = /故事|案件|推理|悬疑|恐怖|刑侦|破案|都市传说|新鲜事|有趣的事|可怕的事|离奇的事|讲个故事|说说故事|什么故事/;
                    if (triggerWords.test(lowerText)) {
                        addMessage('user', { type: 'text', text: text });
                        input.value = '';
                        input.style.height = '42px';
                        // 先给个反馈，再开始故事
                        addMessage('bot', { type: 'text', text: '📖 好呀，让我找个故事...' });
                        setTimeout(() => startRandomStory(), 500);
                        scrollToBottom();
                        return;
                    }
                }
            }

            // ==========================================================
            //  1. 关键词触发（图片/语音）
            // ==========================================================
            const keywordResult = checkKeywords(text);
            if (keywordResult) {
                addMessage('user', { type: 'text', text: text });
                input.value = '';
                input.style.height = '42px';
                if (keywordResult.type === 'image') {
                    const imgPath = keywordResult.content;
                    if (imgPath) {
                        addMessage('bot', { type: 'image', image: imgPath, text: '给你看～' });
                    } else {
                        addMessage('bot', { type: 'text', text: '我翻遍了相册，没找到合适的照片～下次再给你看吧 😊' });
                    }
                } else if (keywordResult.type === 'audio') {
                    showTyping();
                    const ttsText = '你好呀～我是' + current.name + '，很高兴和你聊天～';
                    const audioUrl = await callTTS(ttsText);
                    removeTyping();
                    if (audioUrl) {
                        addMessage('bot', { type: 'audio', src: audioUrl, text: '' });
                    } else {
                        addMessage('bot', { type: 'text', text: '我突然嗓子不舒服…下次再说给你听好不好～ 😣' });
                    }
                }
                scrollToBottom();
                return;
            }

            // ==========================================================
            //  2. 检查是否睡觉（挡3）
            // ==========================================================
            const now = new Date();
            const status = getCurrentStatus(PERSONA_ID, now);
            if (status.level === 3) {
                addMessage('user', { type: 'text', text: text });
                input.value = '';
                input.style.height = '42px';
                addMessage('bot', { type: 'text', text: getDefaultReply(PERSONA_ID) });
                scrollToBottom();
                return;
            }

            // ==========================================================
            //  3. 正常发送（走 AI）
            // ==========================================================
            addMessage('user', { type: 'text', text: text });
            input.value = '';
            input.style.height = '42px';

            const isSlow = (status.level === 2);
            const prefixText = isSlow ? getPrefixText(status.prefixKey, PERSONA_ID) : null;

            isWaiting = true;
            document.getElementById('sendBtn').disabled = true;

            const streamMsg = document.createElement('div');
            streamMsg.className = 'message bot';
            streamMsg.id = 'streamingMessage';
            streamMsg.innerHTML =
                `<span class="bav">${current.emoji}</span> <span id="streamContent"></span><span class="cursor-blink"></span>`;
            const area = document.getElementById('messageArea');
            area.appendChild(streamMsg);
            scrollToBottom();

            let fullReply = '';

            if (isSlow && prefixText) {
                const prefixSpan = document.createElement('span');
                prefixSpan.style.color = '#ff9800';
                prefixSpan.textContent = prefixText + ' ';
                document.getElementById('streamContent').appendChild(prefixSpan);
                fullReply = prefixText + ' ';
            }

            await callDeepSeekStream(
                text,
                (chunk) => {
                    const content = document.getElementById('streamContent');
                    const textNode = document.createTextNode(chunk);
                    content.appendChild(textNode);
                    fullReply += chunk;
                    scrollToBottom();
                },
                (finalText) => {
                    const streamEl = document.getElementById('streamingMessage');
                    if (streamEl) {
                        streamEl.querySelector('.cursor-blink')?.remove();
                        const content = streamEl.querySelector('#streamContent');
                        if (content) {
                            content.textContent = fullReply;
                        }
                        const timeSpan = document.createElement('span');
                        timeSpan.className = 'time';
                        timeSpan.textContent = formatTime(Date.now());
                        streamEl.appendChild(timeSpan);
                        streamEl.id = '';
                        const replyText = fullReply.trim();
                        messages.push({ role: 'bot', text: replyText, time: Date.now() });
                        saveMessages();
                        isWaiting = false;
                        document.getElementById('sendBtn').disabled = false;
                        scrollToBottom();
                    }
                },
                (errorMsg) => {
                    const streamEl = document.getElementById('streamingMessage');
                    if (streamEl) {
                        const content = streamEl.querySelector('#streamContent');
                        if (content) {
                            content.textContent = '⚠️ ' + errorMsg;
                        }
                        streamEl.querySelector('.cursor-blink')?.remove();
                        const timeSpan = document.createElement('span');
                        timeSpan.className = 'time';
                        timeSpan.textContent = formatTime(Date.now());
                        streamEl.appendChild(timeSpan);
                        streamEl.id = '';
                    }
                    isWaiting = false;
                    document.getElementById('sendBtn').disabled = false;
                    showToast('⚠️ ' + errorMsg);
                    scrollToBottom();
                }
            );
        }

        // ================================================================

        // 故事牌堆管理
        const STORY_PILE_KEY = 'story_pile_state';

        function getStoryPile() {
            try {
                const saved = localStorage.getItem(STORY_PILE_KEY);
                if (saved) {
                    const data = JSON.parse(saved);
                    if (data.deck.length === 0) {
                        return resetStoryPile();
                    }
                    return data;
                }
            } catch (e) { }
            return resetStoryPile();
        }

        function resetStoryPile() {
            const catalog = window.STORY_CATALOG || {};
            const allStories = [
                ...(catalog.crime || []),
                ...(catalog.mystery || []),
                ...(catalog.horror || []),
                ...(catalog.urban || [])
            ];
            const shuffled = shuffle([...allStories]);
            const pile = { deck: shuffled, discard: [] };
            localStorage.setItem(STORY_PILE_KEY, JSON.stringify(pile));
            return pile;
        }

        function markStoryPlayed(storyId) {
            const pile = getStoryPile();
            pile.deck = pile.deck.filter(id => id !== storyId);
            pile.discard.push(storyId);
            localStorage.setItem(STORY_PILE_KEY, JSON.stringify(pile));
        }

        function getNextStory() {
            const pile = getStoryPile();
            if (pile.deck.length === 0) {
                const newPile = resetStoryPile();
                return newPile.deck[0] || null;
            }
            return pile.deck[0];
        }

        function startRandomStory() {
            if (typeof window.storyEngine === 'undefined') {
                addMessage('bot', { type: 'text', text: '故事引擎还没加载好，稍等再试试～' });
                return;
            }

            if (window.storyEngine.isActive()) {
                addMessage('bot', { type: 'text', text: '现在正在进行一个故事呢，先把这个听完再说吧～' });
                return;
            }

            const storyId = getNextStory();
            if (!storyId) {
                addMessage('bot', { type: 'text', text: '暂时没有可用的故事～' });
                return;
            }

            addMessage('bot', { type: 'text', text: '📖 稍等，让我找个好故事……' });

            fetch('./js/stories/' + storyId + '.json')
                .then(r => {
                    if (!r.ok) throw new Error('HTTP ' + r.status);
                    return r.json();
                })
                .then(data => {
                    window.storyEngine.startStory(storyId, data);
                    // 标记为已玩
                    markStoryPlayed(storyId);
                    const intro = data.story_intro?.opening_line || data.description || '故事开始了……';
                    addMessage('bot', { type: 'text', text: intro });
                    updateStoryPanelInfo();
                    console.log('✅ 故事已开始:', data.title);
                    console.log('📚 剩余故事数:', getStoryPile().deck.length);
                })
                .catch(err => {
                    console.warn('❌ 跳过坏故事:', storyId, err.message);
                    // 自动从牌堆移除坏故事
                    const pile = getStoryPile();
                    pile.deck = pile.deck.filter(id => id !== storyId);
                    localStorage.setItem('story_pile_state', JSON.stringify(pile));
                    addMessage('bot', { type: 'text', text: '这个故事暂时讲不了，换一个试试～' });
                    // 自动尝试下一个
                    setTimeout(() => startRandomStory(), 500);
                });
        }

        async function init() {

                if (isKeyboardOpen) {
                    setTimeout(scrollToBottom, 50);
                    setTimeout(scrollToBottom, 200);
                    setTimeout(scrollToBottom, 500);
                }

                lastWindowHeight = currentHeight;
            });

            // 3. 使用 VisualViewport API（更精确）
            if (window.visualViewport) {
                let lastViewportHeight = window.visualViewport.height;

                window.visualViewport.addEventListener('resize', function () {
                    const currentHeight = this.height;
                    const isKeyboardOpen = currentHeight < lastViewportHeight && currentHeight < window.screen.height * 0.8;

                    if (isKeyboardOpen) {
                        setTimeout(scrollToBottom, 50);
                        setTimeout(scrollToBottom, 200);
                        setTimeout(scrollToBottom, 500);
                    }

                    lastViewportHeight = currentHeight;
                });
            }

            console.log('✅ 键盘弹起自动滚动已启用');

            console.log('💬 聊天已启动 · ' + current.name);
            console.log('📁 存储 Key: ' + STORAGE_KEY);
            console.log('✅ 所有功能已集成：DeepSeek API · 流式输出 · 固定一周排班 · 时间/天气 · 关键词触发 · TTS · 牌堆机制 · 故事系统');

            console.log('✅ 滚动已强化：多重延迟保障');
        }

      <script>
    // ================================================================
    //  🔧 Android WebView 安全区强制修复
    //  解决：首次加载时 env(safe-area-inset-*) 返回 0 的问题
    // ================================================================

    (function fixAndroidSafeArea() {
      // 只在 Android WebView 中执行
      if (typeof navigator === 'undefined' || !/android/i.test(navigator.userAgent)) {
        return;
      }

      console.log('[安全区修复] Android WebView 检测到，开始修复...');

      // 获取 .app 容器
      function getAppContainer() {
        return document.querySelector('.app');
      }

      // 方法1：通过 JS 获取真实的安全区值
      function getSafeAreaValues() {
        // 创建一个临时元素，用它来读取 env() 的实际计算值
        const temp = document.createElement('div');
        temp.style.cssText = `
            position: fixed;
            top: env(safe-area-inset-top, 0px);
            bottom: env(safe-area-inset-bottom, 0px);
            left: env(safe-area-inset-left, 0px);
            right: env(safe-area-inset-right, 0px);
            visibility: hidden;
            pointer-events: none;
            width: 0;
            height: 0;
            z-index: -9999;
        `;
        document.body.appendChild(temp);

        // 读取计算后的值
        const computed = getComputedStyle(temp);
        const top = computed.top || '0px';
        const bottom = computed.bottom || '0px';
        const left = computed.left || '0px';
        const right = computed.right || '0px';

        document.body.removeChild(temp);

        return {
          top: parseFloat(top) || 0,
          bottom: parseFloat(bottom) || 0,
          left: parseFloat(left) || 0,
          right: parseFloat(right) || 0
        };
      }

      // 方法2：通过 Viewport 高度计算安全区
      function getSafeAreaByViewport() {
        const viewportHeight = window.innerHeight;
        const screenHeight = window.screen.height;

        // 计算差异：如果 viewport 比屏幕小，说明有安全区（状态栏/导航栏）
        let top = 0, bottom = 0;

        // 常见的状态栏高度：24-40px，导航栏高度：36-60px
        // 通过 screen 和 window 的差异来估算
        if (screenHeight > viewportHeight) {
          const diff = screenHeight - viewportHeight;
          // 假设状态栏占 1/3，导航栏占 2/3（粗略估算）
          top = Math.round(diff * 0.4);
          bottom = Math.round(diff * 0.6);
        }

        // 如果差异太小，使用默认值
        if (top < 10) top = 28;   // 状态栏默认 28px
        if (bottom < 10) bottom = 48; // 导航栏默认 48px

        return { top, bottom, left: 0, right: 0 };
      }

      // 方法3：通过点击/触摸事件触发重绘
      function triggerRepaint() {
        const app = getAppContainer();
        if (!app) return;

        // 强制重排重绘
        app.style.transform = 'scale(0.999)';
        requestAnimationFrame(() => {
          app.style.transform = 'scale(1)';
        });
      }

      // 应用安全区
      function applySafeArea() {
        const app = getAppContainer();
        if (!app) {
          console.warn('[安全区修复] .app 容器未找到');
          return;
        }

        // 尝试多种方法获取安全区值
        let safe = getSafeAreaValues();

        // 如果获取到的值都是 0，使用方法2估算
        if (safe.top === 0 && safe.bottom === 0) {
          console.log('[安全区修复] env() 返回 0，使用估算值');
          safe = getSafeAreaByViewport();
        }

        // 确保至少有一个最小值
        const top = Math.max(safe.top, 24);
        const bottom = Math.max(safe.bottom, 16);

        console.log(`[安全区修复] 应用 padding: top=${top}px, bottom=${bottom}px`);

        // 应用 padding
        app.style.paddingTop = top + 'px';
        app.style.paddingBottom = bottom + 'px';

        // 触发重绘
        triggerRepaint();

        // 标记已修复
        app.dataset.safeAreaFixed = 'true';
      }

      // 监听所有页面切换（SPA 场景）
      function observePageChanges() {
        // 监听 URL hash 变化
        window.addEventListener('hashchange', () => {
          setTimeout(applySafeArea, 50);
        });

        // 监听 popstate（浏览器前进后退）
        window.addEventListener('popstate', () => {
          setTimeout(applySafeArea, 50);
        });

        // 监听 MutationObserver（页面内容变化）
        if (window.MutationObserver) {
          const observer = new MutationObserver(() => {
            if (!document.querySelector('.app[data-safe-area-fixed="true"]')) {
              setTimeout(applySafeArea, 50);
            }
          });
          observer.observe(document.body, {
            childList: true,
            subtree: true
          });
        }
      }

      // ===== 执行修复 =====

      // 1. 页面加载完成后立即执行
      if (document.readyState === 'complete') {
        setTimeout(applySafeArea, 100);
      } else {
        window.addEventListener('load', () => {
          setTimeout(applySafeArea, 100);
        });
      }

      // 2. DOM 准备完成后执行
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', () => {
          setTimeout(applySafeArea, 50);
        });
      } else {
        setTimeout(applySafeArea, 50);
      }

      // 3. 延迟多次执行（确保系统值返回）
      setTimeout(applySafeArea, 300);
      setTimeout(applySafeArea, 600);
      setTimeout(applySafeArea, 1000);

      // 4. 监听页面变化
      observePageChanges();

      // 5. 监听窗口大小变化（旋转屏幕等）
      window.addEventListener('resize', () => {
        setTimeout(applySafeArea, 100);
      });

      // 6. 监听 orientation change（横竖屏切换）
      window.addEventListener('orientationchange', () => {
        setTimeout(applySafeArea, 300);
