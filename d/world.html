<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>世界观 · 山东省舒心市</title>
<link rel="stylesheet" href="../common.css">
<style>
/* ========== 深蓝夜空主题 统一颜色变量 ========== */
:root {
  --bg: #141a24;            /* 页面底 */
  --bg-elev: #1A1F2C;       /* 顶/底 抬起层 */
  --bg-card: #232A3B;       /* 卡片 */
  --bg-inner: #1E2433;      /* 内嵌面板 */
  --bg-chip: #2A3144;       /* 标签小色块 */
  --bg-soft: rgba(59, 111, 229, 0.16);
  --bg-yellow: rgba(255, 159, 10, 0.16);
  --b: #2A3144;             /* 边框 */
  --b2: #3A445F;            /* 强调边框 */
  --ba: #3B6FE5;            /* 主蓝（选中/强调） */
  --bay: #FF9F0A;           /* 主黄（概览高亮） */
  --t: #E8ECF4;             /* 主文字白 */
  --t2: #A3ACBE;            /* 次文字灰蓝 */
  --tm: #6B7388;            /* 提示文字灰 */
  --ok: #34C759;            /* 休息/成功绿 */
  --d: #FF453A;             /* 危险红 */
  --r: 8px; --r2: 12px; --r3: 16px; --rf: 999px;
  --font: "MiSans", "MiSans VF", -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  --safe-top: env(safe-area-inset-top, 28px);
  --safe-bottom: env(safe-area-inset-bottom, 32px);
}
* { box-sizing: border-box; margin: 0; padding: 0; max-width: 100%;
  -webkit-tap-highlight-color: transparent;
  tap-highlight-color: transparent;
}
html { height: 100%; }
html, body {
  display: flex; justify-content: center; align-items: stretch; width: 100%; height: 100%; background: #ffffff; color: var(--t); font-family: var(--font); overflow-x: hidden;
  -webkit-tap-highlight-color: transparent;
  tap-highlight-color: transparent;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
}
body {
  display: flex; justify-content: center; align-items: stretch;
  
  position: relative;
  height: 100vh;
}
/* 全局按钮触摸优化 */
button, a, .clickable {
  -webkit-tap-highlight-color: transparent;
  tap-highlight-color: transparent;
  -webkit-touch-callout: none;
  outline: none;
  -webkit-appearance: none;
  appearance: none;
}
button::before, button::after,
a::before, a::after,
.clickable::before, .clickable::after {
  -webkit-tap-highlight-color: transparent;
  tap-highlight-color: transparent;
}
button:focus, a:focus,
button:active, a:active {
  outline: none;
  -webkit-tap-highlight-color: transparent;
}
/* 安全区域白色不透明背景 */
body::before {
  content: '';
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: var(--safe-top);
  background: #ffffff;
  z-index: 9999;
  pointer-events: none;
}
body::after {
  content: '';
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: var(--safe-bottom);
  background: #ffffff;
  z-index: 9999;
  pointer-events: none;
}

/* ========== 全局滚动条隐藏 ========== */
.scroll-hide {
  overflow-y: auto; overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
  -ms-overflow-style: none;
}
.scroll-hide::-webkit-scrollbar { width: 0 !important; height: 0 !important; display: none !important; }

.app {
  position: relative;
  max-width: 480px; margin: 0 auto; height: 100%;
  background: var(--bg);
  display: flex; flex-direction: column; overflow: hidden;
  width: 100%;
  border-radius: 0 !important;
}

/* ========== 顶部栏 ========== */
.topbar {
  display: flex; justify-content: space-between; align-items: flex-start;
  padding: 16px 18px;
  background: var(--bg-elev);
  border-bottom: 1px solid var(--b);
  z-index: 10;
  flex-shrink: 0;
}
.tl { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.tl h1 {
  font: 700 20px/28px var(--font); color: var(--t);
  display: flex; align-items: center; gap: 8px;
}
.tl h1 .logo {
  width: 30px; height: 30px; border-radius: 50%;
  background: linear-gradient(135deg, var(--bay), #FF6E40);
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; color: #fff; flex-shrink: 0;
}
.tl .sub { font: 400 12px/18px var(--font); color: var(--tm); }
.tr { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
.icon-btn {
  width: 44px; height: 44px; border-radius: 50%;
  background: #f0f2f5;
  border: 1px solid #c8ccd4;
  color: #333; font-size: 20px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: 0.18s;
  flex-shrink: 0; user-select: none;
}
.icon-btn:hover { color: var(--ba); border-color: var(--ba); background: #fff; }
.icon-btn:active { transform: scale(0.95); }

/* ========== Loading ========== */
#loadingState {
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}
.loading {
  text-align: center; padding: 40px 20px;
  color: var(--tm); font: 400 13px/19px var(--font);
}
.loading .spinner {
  display: inline-block;
  width: 28px; height: 28px;
  border: 2.5px solid var(--b);
  border-top-color: var(--ba);
  border-radius: 10px;
  animation: spin 0.8s linear infinite;
  margin-bottom: 14px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading .auto-timer {
  font-size: 12px; color: var(--t3); margin-bottom: 10px;
}
.loading .auto-timer b { color: var(--ba); font-weight: 700; }
.loading .f-bt {
  margin-top: 14px;
  padding: 13px 20px;
  font: 700 14px/20px var(--font);
  color: #fff;
  background: linear-gradient(135deg, #3B6FE5 0%, #8B5CF6 100%);
  border: none; border-radius: 10px;
  box-shadow: 0 8px 24px rgba(59,111,229,0.4);
  cursor: pointer;
  animation: pulse-bt 1.6s ease-in-out infinite;
}
@keyframes pulse-bt {
  0%,100% { box-shadow: 0 8px 24px rgba(59,111,229,0.4); transform: scale(1); }
  50%     { box-shadow: 0 10px 30px rgba(139,92,246,0.55); transform: scale(1.03); }
}
.loading .tip {
  margin-top: 10px; font-size: 11px;
  padding: 8px 12px; background: var(--bg-inner);
  border: 1px dashed var(--b2); border-radius: 10px;
  display: inline-block; max-width: 90%;
  word-break: break-all;
}
.loading .tip b { color: var(--ba); }
.loading .tip code {
  background: var(--bg-chip); color: #7FABFF;
  padding: 2px 6px; border-radius: 10px;
  font: 600 10px ui-monospace, Consolas, monospace;
}

/* ========== 内容总容器 ========== */
#contentState {
  display: none;
  flex-direction: column;
  flex: 1;
  min-height: 0;
  overflow: hidden;
}
#contentState.show {
  display: flex !important;
}

/* ========== 4个功能Tab（概览/详情/地标/通勤） ========== */
.tab4 {
  display: grid; grid-template-columns: repeat(4, 1fr);
  gap: 8px; padding: 8px 10px;
  background: var(--bg);
  z-index: 9;
  border-bottom: 1px solid var(--b);
  flex-shrink: 0 !important;
}
.t4 {
  padding: 9px 4px;
  background: var(--bg-card);
  border: 1px solid var(--b);
  border-radius: 10px;
  text-align: center;
  cursor: pointer; transition: 0.18s;
  user-select: none;
  display: flex; flex-direction: column; gap: 3px; align-items: center;
}
.t4:hover { background: var(--bg-inner); }
.t4.active {
  background: var(--bg-soft);
  border-bottom: 2px solid var(--ba);
}
.t4 .em { font-size: 17px; }
.t4 .nm { font: 600 11px/15px var(--font); color: var(--t2); }
.t4.active .nm { color: var(--t); font-weight: 700; }

/* ========== 滚动卡片区 ========== */
.body {
  padding: 0 0 calc(120px + var(--safe-bottom)) 0;
  display: flex; flex-direction: column; gap: 0;
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
}

/* ========== 通用卡片 ========== */
.card {
  background: var(--bg-card);
  border: none;
  border-bottom: 1px solid var(--b);
  border-radius: 10px;
  padding: 14px;
  margin: 0;
}
.c-title {
  font: 700 14px/22px var(--font);
  color: var(--t);
  margin-bottom: 10px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--b);
  display: flex; align-items: center; gap: 7px;
  flex-wrap: wrap;
}
.c-title .st {
  font: 600 10px/14px var(--font);
  background: var(--bg-yellow); color: #FFB547;
  padding: 3px 9px;
  border-radius: 10px;
  border: 1px solid rgba(255, 159, 10, 0.3);
  margin-left: auto;
}
.c-title .st.blue {
  background: var(--bg-soft); color: #7FABFF;
  border-color: rgba(59, 111, 229, 0.3);
}

/* ========== Tab1：概览 3x3 九宫格地图 ========== */
.m-hd {
  font: 600 12px/18px var(--font); color: var(--t2);
  margin-bottom: 10px;
  display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
}
.grid33 {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 7px;
  margin-bottom: 8px;
}
.g-cell {
  aspect-ratio: 1 / 1;
  border-radius: 10px;
  border: 1.5px solid var(--b);
  background: var(--bg-inner);
  padding: 8px 6px;
  cursor: pointer;
  transition: 0.2s;
  display: flex; flex-direction: column;
  justify-content: space-between;
  align-items: flex-start;
  overflow: hidden;
  position: relative;
}
.g-cell:hover { border-color: var(--b2); transform: translateY(-1px); }
.g-cell.active {
  border-color: var(--ba);
  background: var(--bg-soft);
  box-shadow: 0 0 0 3px rgba(59, 111, 229, 0.08);
}
.g-cell .ge {
  width: 30px; height: 30px; border-radius: 50%;
  background: var(--bg-chip);
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; flex-shrink: 0;
}
.g-cell.active .ge { background: rgba(59, 111, 229, 0.25); }
.g-cell .gn {
  font: 700 12px/16px var(--font); color: var(--t);
  word-break: keep-all;
}
.g-cell .gs {
  font: 400 9px/13px var(--font); color: var(--tm);
}
.g-cell .gd {
  position: absolute; top: 6px; right: 6px;
  background: var(--bg-chip);
  padding: 2px 5px;
  border-radius: 10px;
  font: 600 9px/13px var(--font); color: var(--t2);
}
.g-cell .gperson {
  position: absolute; bottom: 5px; right: 5px;
  display: flex; gap: 2px;
}
.gp-dot {
  width: 13px; height: 13px; border-radius: 50%;
  background: linear-gradient(135deg, #EC4899, #8B5CF6);
  display: flex; align-items: center; justify-content: center;
  font-size: 7px;
  border: 1.5px solid #fff;
  color: #fff;
  font-weight: 700;
}
.gp-dot.b { background: linear-gradient(135deg, #6366F1, #06B6D4); }
.gp-dot.c { background: linear-gradient(135deg, #10B981, #3B6FE5); }
.gp-dot.d { background: linear-gradient(135deg, #F59E0B, #EF4444); }

/* 概览：人设地址条 */
.persons {
  display: flex; flex-direction: column; gap: 8px;
  margin-top: 4px;
}
.pers-row {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 10px;
  background: var(--bg-inner);
  border: 1px solid var(--b);
  border-radius: 10px;
}
.pers-row .av {
  width: 34px; height: 34px; border-radius: 50%;
  background: linear-gradient(135deg, #EC4899, #8B5CF6);
  display: flex; align-items: center; justify-content: center;
  font-size: 17px; color: #fff; flex-shrink: 0;
  border: 2px solid var(--b2);
}
.pers-row .av.b { background: linear-gradient(135deg, #6366F1, #06B6D4); }
.pers-row .av.c { background: linear-gradient(135deg, #10B981, #3B6FE5); }
.pers-row .av.d { background: linear-gradient(135deg, #F59E0B, #EF4444); }
.pers-row .pr { flex: 1; min-width: 0; }
.pers-row .nr {
  display: flex; align-items: center; gap: 6px;
  font: 700 12px/18px var(--font); color: var(--t);
  margin-bottom: 2px;
}
.pers-row .nr .tg {
  background: var(--bg-chip); color: var(--t2);
  padding: 2px 7px; border-radius: 10px;
  font: 500 9px/13px var(--font);
}
.pers-row .tt {
  font: 400 11px/15px var(--font); color: var(--tm);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

/* ========== Tab2：区域详情 ========== */
.det-hero {
  display: flex; align-items: center; gap: 12px;
  padding-bottom: 10px; margin-bottom: 10px;
  border-bottom: 1px solid var(--b);
}
.det-hero .ic {
  width: 48px; height: 48px; border-radius: 50%;
  background: var(--bg-soft);
  display: flex; align-items: center; justify-content: center;
  font-size: 25px; flex-shrink: 0;
  border: 1.5px solid rgba(59, 111, 229, 0.3);
}
.det-hero .tx { flex: 1; min-width: 0; }
.det-hero .tx .dtl-nm {
  font: 700 16px/24px var(--font); color: var(--t);
  display: flex; align-items: center; gap: 7px; margin-bottom: 3px;
}
.det-hero .tx .dtl-nm .s-tag {
  background: var(--bg-yellow); color: #FFB547;
  padding: 2px 8px; border-radius: 10px;
  border: 1px solid rgba(255, 159, 10, 0.3);
  font: 600 10px/14px var(--font);
}
.det-hero .tx .dtl-cd {
  font: 500 11px/15px var(--font); color: var(--t2);
  font-family: ui-monospace, Consolas, monospace;
}

/* ========== 新增：城市Banner + 背景图 + 渐变蒙版 ========== */
.city-banner {
  width: 100%;
  min-height: 200px;
  border-radius: 10px;
  margin-bottom: 12px;
  padding: 24px 18px;
  background: linear-gradient(135deg, rgba(59,111,229,0.45) 0%, rgba(20,24,33,0.90) 100%), var(--bg-inner);
  background-size: cover;
  background-position: center;
  border: 1px solid var(--b2);
  display: flex; flex-direction: column; justify-content: flex-end;
  position: relative;
  overflow: hidden;
}
.city-banner .cb-name {
  font: 800 26px/36px var(--font);
  color: #fff;
  letter-spacing: 1px;
  margin-bottom: 3px;
  display: flex; align-items: center; gap: 9px;
  text-shadow: 0 2px 8px rgba(0,0,0,0.55);
}
.city-banner .cb-name .ic {
  width: 40px; height: 40px; border-radius: 50%;
  background: rgba(255,255,255,0.18);
  backdrop-filter: blur(4px);
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; flex-shrink: 0;
  border: 1.5px solid rgba(255,255,255,0.3);
}
.city-banner .cb-sub {
  font: 400 13px/20px var(--font);
  color: rgba(255,255,255,0.82);
  text-shadow: 0 1px 4px rgba(0,0,0,0.6);
  max-width: 92%;
}
.city-banner .cb-meta {
  position: absolute; top: 14px; right: 14px;
  background: rgba(0,0,0,0.35);
  backdrop-filter: blur(4px);
  padding: 4px 10px;
  border-radius: 10px;
  font: 600 10px/14px var(--font);
  color: rgba(255,255,255,0.9);
  border: 1px solid rgba(255,255,255,0.2);
}

/* 九宫格格子：有背景图时叠加蒙版（上浅下深 保证底部文字清晰） */
.g-cell.has-bg {
  background: linear-gradient(160deg, rgba(20,24,33,0.35) 0%, rgba(20,24,33,0.82) 70%, rgba(20,24,33,0.94) 100%), var(--bg-inner);
  background-size: cover;
  background-position: center;
  background-blend-mode: normal;
}
.g-cell.has-bg .gd { background: rgba(0,0,0,0.45); color: #fff; border: 1px solid rgba(255,255,255,0.2); }
.g-cell.has-bg .ge { background: rgba(255,255,255,0.18); color: #fff; backdrop-filter: blur(3px); border: 1px solid rgba(255,255,255,0.25); }
.g-cell.has-bg .gn { color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,0.75); font-weight: 800; }
.g-cell.has-bg .gs { color: rgba(255,255,255,0.8); text-shadow: 0 1px 2px rgba(0,0,0,0.7); }
.g-cell.has-bg.active {
  border-color: var(--ba);
  background: linear-gradient(160deg, rgba(59,111,229,0.35) 0%, rgba(20,24,33,0.82) 70%, rgba(20,24,33,0.94) 100%), var(--bg-soft);
  background-size: cover, auto;
  background-position: center, center;
}

/* 详情页Hero大图：背景图+蒙版 */
.det-hero.has-bg {
  min-height: 200px;
  border-radius: 10px;
  padding: 22px 18px;
  border: 1px solid var(--b2);
  border-bottom: 1px solid var(--b2);
  background: linear-gradient(135deg, rgba(59,111,229,0.40) 0%, rgba(20,24,33,0.92) 100%), var(--bg-inner);
  background-size: cover;
  background-position: center;
  align-items: flex-end;
  margin-bottom: 12px;
  position: relative;
  overflow: hidden;
}
.det-hero.has-bg .ic {
  background: rgba(255,255,255,0.2);
  backdrop-filter: blur(4px);
  border: 1.5px solid rgba(255,255,255,0.3);
  position: absolute;
  top: 18px; left: 18px;
  width: 56px; height: 56px; border-radius: 50%; font-size: 30px;
}
.det-hero.has-bg .tx .dtl-nm {
  font-size: 24px; line-height: 34px; font-weight: 800; color: #fff;
  text-shadow: 0 2px 8px rgba(0,0,0,0.55);
}
.det-hero.has-bg .tx .dtl-nm .s-tag {
  background: rgba(255,159,10,0.35);
  backdrop-filter: blur(4px);
  border-color: rgba(255,255,255,0.3);
  color: #FFE1B3;
}
.det-hero.has-bg .tx .dtl-cd {
  color: rgba(255,255,255,0.85);
  text-shadow: 0 1px 3px rgba(0,0,0,0.6);
  margin-top: 4px;
  background: rgba(0,0,0,0.3);
  padding: 3px 9px;
  border-radius: 10px;
  display: inline-block;
  border: 1px solid rgba(255,255,255,0.15);
}
.det-desc {
  padding: 10px 12px;
  background: var(--bg-inner);
  border-radius: 10px;
  border: 1px solid var(--b);
  font: 400 12px/20px var(--font); color: var(--t2);
  margin-bottom: 10px;
}
.lm-list {
  display: flex; flex-direction: column; gap: 6px;
}
.lm-it {
  display: flex; align-items: center; gap: 9px;
  padding: 8px 10px;
  background: var(--bg-inner);
  border: 1px solid var(--b);
  border-radius: 10px;
  cursor: pointer; transition: 0.18s;
}
.lm-it:hover { border-color: var(--b2); background: var(--bg-card); }
.lm-it:active { transform: scale(0.99); }
.lm-it .lcat {
  width: 32px; height: 32px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; flex-shrink: 0;
}
.lcat.food { background: rgba(255, 159, 10, 0.15); }
.lcat.shop { background: rgba(236, 72, 153, 0.15); }
.lcat.spot { background: rgba(52, 199, 89, 0.15); }
.lcat.hosp { background: rgba(255, 69, 58, 0.15); }
.lcat.sch  { background: rgba(59, 111, 229, 0.15); }
.lcat.gov  { background: rgba(139, 92, 246, 0.15); }
.lcat.ent  { background: rgba(236, 72, 153, 0.15); }
.lcat.hot  { background: rgba(59, 111, 229, 0.15); }
.lcat.ind  { background: rgba(255, 159, 10, 0.15); }
.lm-it .info { flex: 1; min-width: 0; }
.lm-it .info .nm { font: 600 12px/17px var(--font); color: var(--t); }
.lm-it .info .nm .ow {
  margin-left: 5px;
  background: var(--bg-yellow); color: #FFB547;
  padding: 1px 6px; border-radius: 10px;
  font: 600 9px/13px var(--font);
}
.lm-it .info .ad { font: 400 10px/14px var(--font); color: var(--tm); }

/* ========== Tab3：地标卡片 + 分类筛选 ========== */
.chips {
  display: flex; gap: 6px; flex-wrap: wrap;
  margin-bottom: 10px;
}
.chip {
  padding: 5px 11px;
  background: var(--bg-inner);
  border: 1px solid var(--b);
  border-radius: 10px;
  font: 500 11px/16px var(--font);
  color: var(--t2);
  cursor: pointer; transition: 0.18s;
  user-select: none;
}
.chip:hover { border-color: var(--b2); color: var(--t); }
.chip.active {
  background: var(--ba);
  border-color: var(--ba);
  color: #fff;
  font-weight: 600;
}
.card-grid {
  display: grid; grid-template-columns: repeat(2, 1fr);
  gap: 7px;
}
.cd {
  border: 1px solid var(--b);
  border-radius: 10px;
  background: var(--bg-inner);
  padding: 9px;

    const btnWidth = 44;
    const centerX = rect.left + rect.width / 2;
    const rightOffset = window.innerWidth - centerX - btnWidth / 2;
    btn.style.right = rightOffset + 'px';
  }
}

/* ========== 加载数据（5秒超时 + 5.5秒总超时，解决安卓WebView下fetch永远pending问题） ========== */
async function loadData(show=false) {
  if (ST.loading) return;
  ST.loading = true;
  const timeoutPromise = new Promise((_, reject) => setTimeout(() => reject(new Error('5秒超时')), 5000));
  try {
    const worldUrl = location.protocol === 'file:' ? DATA_PATH : DATA_PATH + '?t=' + Date.now();
    const r = await Promise.race([fetch(worldUrl), timeoutPromise]);
    if (!r.ok) throw new Error('HTTP '+r.status);
    ST.data = await r.json();
    ST.usingFallback = false;
    // 计算总块数
    let totalBlocks = 0;
    (ST.data.districts || []).forEach(d => { totalBlocks += (d.blocks || []).length; });
    if (show) showToast('✅ 世界观数据刷新成功（'+ST.data.districts.length+'区 · '+totalBlocks+'块 / '+ST.data.landmarks.length+'地标 / '+ST.data.personas.length+'人设）', 'ok');
  } catch(e) {
    console.warn('[World] 本地读取失败/超时，使用后备:', e);
    ST.data = fallbackData();
  } finally {
    ST.loading = false;
  }
}

/* ========== 手点/自动 强制兜底入口（用户能主动触发，必进内容页） ========== */
let _WORLD_FORCE_DONE = false;
function FORCE_FALLBACK_WORLD(fromUser=false) {
  if (_WORLD_FORCE_DONE) return;
  _WORLD_FORCE_DONE = true;
  ST.data = fallbackData();
  ST.usingFallback = true;
  ST.loading = false;
  if (fromUser) showToast('🔧 已切换示例数据（建议启本地服务器读取你自己的JSON+背景图）', 'warn');
  try { clearInterval(window.__WORLD_COUNTDOWN_TID); } catch(e) {}
  const at = document.getElementById('autoTimer');
  if (at) at.style.display = 'none';
  document.getElementById('loadingState').style.display = 'none';
  document.getElementById('contentState').classList.add('show');
  setTimeout(alignBackButton, 200);
  try {
    buildCommuteOpts();
    ST.district = (ST.data.districts?.[0]?.name) || '星湖区';
    renderBody();
  } catch(e) { console.error(e); }
}

/* ========== 生成通勤下拉选项（区域+人设家+人设工作+所有地标） ========== */
function buildCommuteOpts() {
  const opts = [];
  // 区域选项 - 使用区域中心的全局坐标
  (ST.data.districts || []).forEach(d => {
    // 计算区域中心的全局坐标
    const blocks = d.blocks || [];
    let centerCoord = d.coord;
    if (blocks.length > 0) {
      const midIdx = Math.floor(blocks.length / 2);
      centerCoord = blocks[midIdx].global_coord;
    }
    opts.push({ grp: '📍 区域', label: `${d.emoji} ${d.name}（${d.style}）`, value: centerCoord });
  });
  // 人设家/工作 - 使用全局坐标
  (ST.data.personas || []).forEach(p => {
    const homeLabel = p.home_detail || `${p.district}${p.block_id ? ' '+p.block_id : ''} · ${p.home_addr||''}`;
    const workLabel = p.work_detail || `${p.workplace||'单位'}`;
    opts.push({ grp: '🏠 人设·家',   label: `${p.emoji} ${p.name}家（${homeLabel}）`, value: p.home_coord });
    opts.push({ grp: '💼 人设·工作', label: `${p.emoji} ${p.name}·${workLabel}`, value: p.work_coord });
  });
  // 地标 - 使用全局坐标
  (ST.data.landmarks || []).forEach(l => {
    const m = CAT_META()[l.category] || {icon:'📍'};
    let lb = `${m.icon} ${l.name}`;
    if (l.block_id) lb += ` [${l.block_id}]`;
    if (l.owner) lb += `（${l.owner}）`;
    opts.push({ grp: '🏷️ 地标：'+(l.category||'其他'), label: lb, value: l.coord });
  });
  ST.commuteOpts = opts;
}

/* ========== 切换Tab ========== */
function switchTab(t) {
  ST.tab = t;
  document.querySelectorAll('.t4').forEach(el => {
    el.classList.toggle('active', el.dataset.t === t);
  });
  renderBody();
  document.getElementById('tabBody').scrollTop = 0;
}

/* ========== 按分类筛选地标 ========== */
function filterBy(cat) {
  ST.filter = cat;
  renderBody();
}

/* ========== 选择区域（概览点击 → 跳详情Tab） ========== */
function pickDistrict(name) {
  ST.district = name;
  ST.tab = 'detail';
  switchTab('detail');
}

/* ========== 渲染入口 ========== */
function renderBody() {
  const t = ST.tab;
  const bd = document.getElementById('tabBody');
  if (t === 'overview') bd.innerHTML = renderOverview();
  if (t === 'detail')   bd.innerHTML = renderDetail();
  if (t === 'landmark') bd.innerHTML = renderLandmark();
  if (t === 'commute')  bd.innerHTML = renderCommute();
  if (t === 'commute') bindCommuteSelect();
}

  const grps = {};
  ST.commuteOpts.forEach((o,i) => {
    if (!grps[o.grp]) grps[o.grp] = [];
    grps[o.grp].push({...o, idx:i});
  });
  const buildOpts = (selKey) => {
    let html = '';
    Object.keys(grps).forEach(g => {
      html += `<optgroup label="${g}">`;
      grps[g].forEach(o => {
        const sel = (ST[selKey]!==null && ST[selKey]===o.idx) ? 'selected' : '';
        html += `<option value="${o.idx}" ${sel}>${o.label}</option>`;
      });
      html += `</optgroup>`;
    });
    return html;
  };

  // 若未选择起点，默认第一个甜小朵的家，终点默认第二个白洁的酒店
  if (ST.fromSel === null) {
    const pHome = ST.commuteOpts.findIndex(o => o.grp === '🏠 人设·家');
    ST.fromSel = pHome >= 0 ? pHome : 0;
  }
  if (ST.toSel === null) {
    const qj = ST.commuteOpts.findIndex(o => /万达广场|天鹅湖/.test(o.label));
    ST.toSel = qj >= 0 ? qj : Math.min(1, ST.commuteOpts.length-1);
  }

  const from = ST.commuteOpts[ST.fromSel];
  const to = ST.commuteOpts[ST.toSel];
  const res = calcRoute(from, to);

  const walk  = formatMin(res.walk);
  const ebike = formatMin(res.ebike);
  const bus   = formatMin(res.bus);
  const drive_now   = formatMin(res.drive_now);
  const drive_flat  = formatMin(res.drive_flat);

  // 开车4档时段文本
  const CR = ST.data.commute_rules || {};
  const SLOTS = res.drive_by_slot || {};
  const slotLabels = (CR.drive_speed_by_time || {});
  const slotCardsHtml = ['morning_peak','daytime_flat','evening_peak','night_clear'].map(k => {
    if (!SLOTS[k] || !slotLabels[k]) return '';
    const info = slotLabels[k];
    const isNow = (k === res.drive_slot_now);
    return `<div class="rr-sub-slot ${isNow?'now':''}">
      <span class="sl">${info.label.split(' ')[0]||k}${isNow?' · 此刻':''}</span>
      <span class="sm">${info.speed_kmh}km/h</span>
      <span class="st">${formatMin(SLOTS[k])}</span>
    </div>`;
  }).join('');

  // 推荐交通方式（结合当前时段！高峰时电车比开车快）
  let recommendMode = 'walk';
  let recommendText = '';
  const nowIsPeak = (res.drive_slot_now === 'morning_peak' || res.drive_slot_now === 'evening_peak');
  if (res.dist === 0) {
    recommendMode = 'walk'; recommendText = '🚪 就在同一个地方';
  } else if (res.dist <= 2) {
    recommendMode = 'walk'; recommendText = '🚶 步行即可（1km内）';
  } else if (res.dist <= 6) {
    if (nowIsPeak) { recommendMode = 'ebike'; recommendText = '🛵 高峰时段电车比开车快！'; }
    else           { recommendMode = 'ebike'; recommendText = '🛵 电动车最方便'; }
  } else if (res.dist <= 10) {
    if (nowIsPeak) { recommendMode = 'ebike'; recommendText = '🛵 高峰电车更快，5km+也碾压'; }
    else           { recommendMode = 'drive'; recommendText = '🚗 开车或电车都行'; }
  } else {
    if (res.drive_slot_now === 'night_clear') { recommendMode = 'drive'; recommendText = '🚗 夜间畅通，开车最快'; }
    else if (nowIsPeak)                      { recommendMode = 'bus';   recommendText = '🚌 太远+高峰，公交或打车'; }
    else                                      { recommendMode = 'drive'; recommendText = '🚗 距离远，开车最合适'; }
  }

  return `
    <div class="card">
      <div class="c-title">
        🚗 通勤计算
        <span class="st blue">曼哈顿 · ${res.dist}格 / ${res.dist_km} km（1块=${res.block_meters||500}米）</span>
      </div>
      <div class="route-hint">
        📐 比例尺定死：1曼哈顿格 = 1方块 = 500米 · 步行4km/h · 电车25km/h · 公交18km/h<br>
        🕒 开车4档时段(B方案)：<b style="color:#e67e22;">早高峰07-09(12km/h)</b> · 平峰09-17(30km/h) · <b style="color:#e67e22;">晚高峰17-19(15km/h)</b> · 夜间19-07(45km/h) · 此刻 <span style="color:#3a7bd5;">${res.drive_slot_label||''}</span>
      </div>

      <div class="route-sel">
        <div class="sel-row">
          <div class="lb">🚩</div>
          <div class="mid">
            <div class="kt">起点 FROM</div>
            <select id="selFrom">${buildOpts('fromSel')}</select>
          </div>
        </div>
        <div class="sel-row end">
          <div class="lb">🏁</div>
          <div class="mid">
            <div class="kt">终点 TO</div>
            <select id="selTo">${buildOpts('toSel')}</select>
          </div>
        </div>
      </div>

      <div class="route-info" style="margin-bottom:12px;">
        <div class="ln"><div class="k">推荐方式</div><div class="v"><span style="color:#FFB547;font-weight:600;">${recommendText}</span></div></div>
        <div class="ln"><div class="k">曼哈顿计算</div><div class="v">|${from.value[0]}−${to.value[0]}| + |${from.value[1]}−${to.value[1]}| = ${res.dist}格 = ${res.dist_km} 公里</div></div>
      </div>

      <div class="route-res">
        <div class="rr walk ${recommendMode==='walk'?'recommend':''}">
          <div class="rr-h"><div class="ic">🚶</div>步行<br><span style="font-weight:400;font-size:10px;color:#7a8aa3;">4 km/h</span></div>
          <div class="rr-tm">${walk}</div>
          <div class="rr-sub">${res.dist}格 × 7.5分/格</div>
        </div>
        <div class="rr bike ${recommendMode==='ebike'?'recommend':''}">
          <div class="rr-h"><div class="ic">🛵</div>电动车<br><span style="font-weight:400;font-size:10px;color:#7a8aa3;">25 km/h</span></div>
          <div class="rr-tm">${ebike}</div>
          <div class="rr-sub">${res.dist}格 × 1.2分/格</div>
        </div>
        <div class="rr bus ${recommendMode==='bus'?'recommend':''}">
          <div class="rr-h"><div class="ic">🚌</div>公交<br><span style="font-weight:400;font-size:10px;color:#7a8aa3;">18 km/h</span></div>
          <div class="rr-tm">${bus}</div>
          <div class="rr-sub">${res.dist}格 × 1.67分/格</div>
        </div>
        <div class="rr drive ${recommendMode==='drive'?'recommend':''}">
          <div class="rr-h"><div class="ic">🚗</div>开车<br><span style="font-weight:400;font-size:10px;color:#7a8aa3;">当前= ${drive_now}</span></div>
          <div class="rr-tm">${drive_now}</div>
          <div class="rr-sub">平峰参考 ${drive_flat}</div>
          <div class="rr-slots" style="margin-top:6px;padding-top:6px;border-top:1px dashed rgba(255,255,255,0.08);display:flex;flex-direction:column;gap:3px;">
            ${slotCardsHtml}
          </div>
        </div>
      </div>

      <div class="route-info">
        <div class="ln"><div class="k">起点</div><div class="v">${from.label}</div></div>
        <div class="ln"><div class="k">起点坐标</div><div class="v blue">[${from.value[0]}, ${from.value[1]}]（9×9网格）</div></div>
        <div class="ln"><div class="k">终点</div><div class="v">${to.label}</div></div>
        <div class="ln"><div class="k">终点坐标</div><div class="v blue">[${to.value[0]}, ${to.value[1]}]（9×9网格）</div></div>
      </div>
    </div>

    <div class="foot">
      规则：<code class="y">all/d/data.json → commute_rules</code> · 可用数据：${ST.commuteOpts.length} 个点
    </div>
  `;
}

function bindCommuteSelect() {
  const s1 = document.getElementById('selFrom');
  const s2 = document.getElementById('selTo');
  if (s1) s1.addEventListener('change', e => {
    ST.fromSel = parseInt(e.target.value) || 0;

/* ========== 通勤比例尺工具函数（v2 · 1块=500米 · B方案4档开车时段） ========== */
// 根据小时返回开车时段 key：morning_peak / daytime_flat / evening_peak / night_clear
function getDriveSlotKey(hour) {
  if (hour == null) hour = new Date().getHours();
  const CR = ST.data.commute_rules || {};
  const slots = CR.drive_speed_by_time || {};
  for (const k in slots) {
    if ((slots[k].hours || []).indexOf(hour) >= 0) return k;
  }
  // fallback
  if (hour >= 7  && hour < 9)  return 'morning_peak';
  if (hour >= 9  && hour < 17) return 'daytime_flat';
  if (hour >= 17 && hour < 19) return 'evening_peak';
  return 'night_clear';
}
// 返回该小时的开车配置 {speed_kmh, per_grid_min, label}
function getDriveSpeedInfo(hour) {
  if (hour == null) hour = new Date().getHours();
  const CR = ST.data.commute_rules || {};
  const key = getDriveSlotKey(hour);
  return (CR.drive_speed_by_time && CR.drive_speed_by_time[key]) ||
         { speed_kmh: 30, per_grid_min: 1.0, label: '默认 30km/h' };
}
/* ========== 曼哈顿距离计算 ========== */
function calcRoute(from, to, opts) {
  opts = opts || {};
  const [r1, c1] = from.value;
  const [r2, c2] = to.value;
  const dist = Math.abs(r1 - r2) + Math.abs(c1 - c2);
  const euclid = (Math.sqrt(Math.pow(r1-r2,2) + Math.pow(c1-c2,2))).toFixed(2);
  const CR = ST.data.commute_rules || {};
  const BLOCK_KM = CR.block_km || 0.5;
  // 步行 / 电车 / 公交：固定每格时间
  const walk  = dist * (CR.per_grid_walk_min  != null ? CR.per_grid_walk_min  : 7.5);
  const ebike = dist * (CR.per_grid_ebike_min != null ? CR.per_grid_ebike_min : 1.2);
  const bus   = dist * (CR.per_grid_bus_min   != null ? CR.per_grid_bus_min   : 1.67);
  // 开车：分4档时段，外加"当前小时"实际值
  const slots = CR.drive_speed_by_time || {};
  const drive_by_slot = {};
  for (const k in slots) {
    drive_by_slot[k] = dist * (slots[k].per_grid_min != null ? slots[k].per_grid_min : 1.0);
  }
  const nowHour = (opts.hour != null) ? opts.hour : new Date().getHours();
  const nowSlot = getDriveSlotKey(nowHour);
  const drive_now = dist * (getDriveSpeedInfo(nowHour).per_grid_min || 1.0);
  const drive_flat = dist * (CR.per_grid_drive_min != null ? CR.per_grid_drive_min : 1.0); // 平峰为向后兼容
  return {
    dist,                       // 曼哈顿格数
    dist_km: +(dist * BLOCK_KM).toFixed(2),  // 实际公里数（1块=500米）
    euclid,
    block_meters: CR.block_meters || 500,
    walk,
    ebike,
    bus,
    drive_flat,                 // 平峰（兼容旧字段）
    drive_now,                  // 当前小时真实开车时间
    drive_slot_now: nowSlot,    // 当前时段key
    drive_slot_label: getDriveSpeedInfo(nowHour).label,
    drive_by_slot,              // 4个时段完整数据
    nowHour,
  };
}
function formatMin(m) {
  m = Math.round(m);
  if (m === 0) return '🚪 同地';
  if (m < 60) return m + ' 分钟';
  const h = Math.floor(m / 60), mm = m % 60;
  return mm === 0 ? `${h} 小时` : `${h}h ${mm}分`;
}

/* ========== Modal 地标详情 ========== */
function openLandmark(name) {
  const l = (ST.data.landmarks || []).find(x => x.name === name);
  if (!l) return;
  const m = CAT_META()[l.category] || {icon:'📍'};
  const D = (ST.data.districts||[]).find(d=>d.name===l.district);
  const coord = l.coord || D?.coord || [0,0];

  // 计算去甜小朵家/白洁家/小雅家/小舒的时间
  const routes = (ST.data.personas || []).slice(0,3).map(p => {
    const r = calcRoute({value:coord}, {value:p.home_coord});
    return {name:p.name, emoji:p.emoji, time: formatMin(r.drive)};
  });

  document.getElementById('mdTitle').innerHTML = `${m.icon} ${l.name} <span style="font:500 11px/16px var(--font);color:#FFB547;margin-left:7px;background:rgba(255,159,10,0.15);padding:2px 8px;border-radius: 10px;">${l.category || '其他'}</span>`;
  document.getElementById('mdBody').innerHTML = `
    <div class="card" style="padding:12px;margin:0;">
      <div class="det-desc" style="margin-bottom:10px;">📍 ${l.address || '—'}<br>🗺️ ${l.district || '—'} · 坐标 [${coord[0]}, ${coord[1]}]</div>
      <div class="route-info">
        <div class="ln"><div class="k">所属区域</div><div class="v">${D?D.emoji+' '+D.name:l.district}</div></div>
        <div class="ln"><div class="k">区域风格</div><div class="v">${D?D.style||'—':'—'}</div></div>
        ${l.owner?`<div class="ln"><div class="k">关联人设</div><div class="v blue">✨ ${l.owner}</div></div>`:''}
      </div>
    </div>

    <div class="card" style="padding:12px;margin:0;">
      <div class="c-title" style="margin-bottom:8px;">🚗 到人设家的开车时间</div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;">
        ${routes.map(r=>`<div class="rr drive" style="padding:8px;"><div class="rr-h"><div class="ic" style="width:20px;height:20px;font-size:11px;">${r.emoji||'👤'}</div><span style="font:700 10px/14px var(--font);color:var(--t);">${r.name}</span></div><div class="rr-tm" style="font-size:13px;line-height:18px;">${r.time}</div></div>`).join('')}
      </div>
    </div>

    <div class="card" style="padding:12px;margin:0;">
      <div class="c-title" style="margin-bottom:8px;">🧭 最近地铁站/主干道（参考）</div>
      <div class="route-info">
        ${closestStreets(coord)}
      </div>
    </div>

    <button onclick="closeMd();switchTab('commute');presetRouteToLandmark('${l.name.replace(/'/g,"\\'")}')" style="width:100%;padding:12px;margin-top:2px;background:var(--ba);color:#fff;border:none;border-radius: 10px;font:600 13px/20px var(--font);cursor:pointer;">📍 以此地标为终点，进入通勤页</button>
  `;
  document.getElementById('mdMask').classList.add('show');
}
function closeMd() { document.getElementById('mdMask').classList.remove('show'); }

function presetRouteToLandmark(name) {
  const l = (ST.data.landmarks||[]).find(x=>x.name===name);
  if (!l) return;
  const idx = ST.commuteOpts.findIndex(o => o.label.includes(name));
  if (idx >= 0) ST.toSel = idx;
  renderBody();
}

/* ========== 估算最近的3条横街+3条纵街（给详情页参考） ========== */
function closestStreets(coord) {
  const [r, c] = coord;
  const ns = (ST.data.streets?.northSouth || []);
  const ew = (ST.data.streets?.eastWest || []);
  const snap = (i, arr) => arr[Math.max(0, Math.min(arr.length-1, i-1))] || '—';
  const cNear = [snap(c, ns), snap(c+1, ns), snap(c-1, ns)].filter((v,i,a)=>a.indexOf(v)===i).slice(0,3);
  const rNear = [snap(r, ew), snap(r+1, ew), snap(r-1, ew)].filter((v,i,a)=>a.indexOf(v)===i).slice(0,3);
  return `
    <div class="ln"><div class="k">纵街（南北）</div><div class="v blue">${cNear.join(' · ')}</div></div>
    <div class="ln"><div class="k">横街（东西）</div><div class="v blue">${rNear.join(' · ')}</div></div>
  `;
}

/* ========== Toast ========== */
let _tt = null;
function showToast(msg, type='info') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast ' + (type==='ok'?'ok':type==='err'?'err':type);
  void el.offsetWidth;
  el.classList.add('show');
  clearTimeout(_tt);
  _tt = setTimeout(()=>el.classList.remove('show'), 2800);
}
function tryClose() {
  // 优先使用历史记录返回（手机返回键也能工作）
  if (window.history.length > 1) {
    window.history.back();
  } else {
    location.href = '../index.html';
  }
}

  buildCommuteOpts();
  renderBody();
}

  setTimeout(() => {
    const loadingDiv = document.getElementById('loadingState');
    if (loadingDiv && loadingDiv.style.display !== 'none') {
      console.warn('[World] 8秒自动兜底：fetch永远pending卡住，强制切fallback');
      FORCE_FALLBACK_WORLD(false);
    }
  }, 8000);

  // 3. 正常流程：loadData 内已有 5 秒超时

  document.getElementById('contentState').classList.add('show');
  setTimeout(alignBackButton, 200);
    document.getElementById('contentState').classList.add('show');

    renderBody();

/* ========== 对齐右下角返回按钮到右上角按钮 ========== */
function alignBackButton() {
  const btn = document.querySelector('.back-floating');
  const topBtns = document.querySelectorAll('.tr .icon-btn');
  const topBackBtn = topBtns[1];
  if (btn && topBackBtn) {
    const rect = topBackBtn.getBoundingClientRect();
    const btnWidth = 44;
    const centerX = rect.left + rect.width / 2;
    const rightOffset = window.innerWidth - centerX - btnWidth / 2;
    btn.style.right = rightOffset + 'px';
  }
}
window.addEventListener('load', alignBackButton);
window.addEventListener('resize', alignBackButton);
window.addEventListener('orientationchange', alignBackButton);
// 内容显示后再次对齐
const _origShowContent = () => {
  document.getElementById('contentState').classList.add('show');
  setTimeout(alignBackButton, 200);
  setTimeout(alignBackButton, 100);
};

/* ========== 手势滑动退出功能 ========== */
(function() {
  let startX = 0, startY = 0, currentX = 0, currentY = 0;
  let isSwiping = false;
  const SWIPE_THRESHOLD = 80;
  const EDGE_ZONE = 30;
  
  document.addEventListener('touchstart', function(e) {
    const touch = e.touches[0];
    startX = touch.clientX;
    startY = touch.clientY;
    currentX = startX;
    currentY = startY;
    isSwiping = true;
    if (startX < EDGE_ZONE) {
      e.preventDefault();
    }
  }, { passive: false });
  
  document.addEventListener('touchmove', function(e) {
    if (!isSwiping) return;
    const touch = e.touches[0];
    currentX = touch.clientX;
    currentY = touch.clientY;
    if (startX < EDGE_ZONE && currentX > startX) {
      e.preventDefault();
    }
  }, { passive: false });
  
  document.addEventListener('touchend', function() {
    if (!isSwiping) return;
    isSwiping = false;
    const deltaX = currentX - startX;
    const deltaY = Math.abs(currentY - startY);
    if (startX < EDGE_ZONE && deltaX > SWIPE_THRESHOLD && deltaY < 100) {
      showToast('← 返回主界面', 'info');
      setTimeout(() => {
        tryClose();
      }, 200);
    }
  });
})();
