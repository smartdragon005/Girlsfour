<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>聊天 · 舒心市</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            height: 100%;
            font-family: -apple-system, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
            background: #ededed;
            color: #1a1a1a;
            overflow: hidden;
            touch-action: manipulation;
        }

        .app {
            max-width: 430px;
            width: 100%;
            height: 100vh;
            margin: 0 auto;
            background: #ededed;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            padding-top: env(safe-area-inset-top, 20px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }

        .chat-header {
            display: flex;
            align-items: center;
            padding: 8px 10px 8px 6px;
            background: #ffffff;
            border-bottom: 0.5px solid #d9d9d9;
            flex-shrink: 0;
            min-height: 50px;
        }
        .chat-header .back {
            font-size: 24px;
            color: #3a7bd5;
            cursor: pointer;
            padding: 0 4px;
            line-height: 1;
            border: none;
            background: none;
            font-family: inherit;
        }
        .chat-header .back:active { opacity: 0.5; }
        .chat-header .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            background: #e8e8e8;
            border: 1px solid #d9d9d9;
            margin: 0 8px;
            flex-shrink: 0;
            overflow: hidden;
        }
        .chat-header .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }
        .chat-header .info { flex: 1; min-width: 0; }
        .chat-header .info .name {
            font-size: 16px;
            font-weight: 500;
            color: #1a1a1a;
        }
        .chat-header .info .status {
            font-size: 11px;
            color: #8e8e93;
        }
        .chat-header .info .status.online { color: #4ade80; }

        .menu-wrapper {
            position: relative;
            flex-shrink: 0;
        }
        .menu-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background: transparent;
            color: #8e8e93;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: inherit;
        }
        .menu-btn:active { background: #f0f0f0; }

        .menu-dropdown {
            position: absolute;
            right: 0;
            top: 40px;
            background: #ffffff;
            border: 0.5px solid #d9d9d9;
            border-radius: 12px;
            padding: 4px 0;
            min-width: 180px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.12);
            display: none;
            z-index: 100;
            overflow: hidden;
        }
        .menu-dropdown.open { display: block; }
        .menu-dropdown .item {
            padding: 10px 16px;
            font-size: 13px;
            color: #1a1a1a;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            border: none;
            background: transparent;
            width: 100%;
            text-align: left;
            font-family: inherit;
        }
        .menu-dropdown .item:active { background: #f5f5f5; }
        .menu-dropdown .item .icon { font-size: 16px; width: 24px; text-align: center; }
        .menu-dropdown .item.danger { color: #ff3b30; }
        .menu-dropdown .item.danger:active { background: #fce4ec; }
        .menu-dropdown .divider {
            height: 0.5px;
            background: #f0f0f0;
            margin: 4px 12px;
        }

        .message-area {
            flex: 1;
            overflow-y: auto;
            padding: 12px 14px 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            background: #ededed;
        }
        .message-area::-webkit-scrollbar { width: 0; display: none; }

        .clear-hint {
            text-align: center;
            padding: 30px 20px;
            color: #8e8e93;
            font-size: 14px;
        }
        .clear-hint .icon { font-size: 32px; display: block; margin-bottom: 8px; }

        .message {
            max-width: 82%;
            padding: 10px 14px;
            border-radius: 16px;
            font-size: 15px;
            line-height: 1.5;
            word-break: break-word;
            animation: fadeIn 0.2s ease;
            position: relative;
        }
        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(6px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .message.user {
            align-self: flex-end;
            background: #3a7bd5;
            color: #fff;
            border-bottom-right-radius: 4px;
        }
        .message.bot {
            align-self: flex-start;
            background: #ffffff;
            color: #1a1a1a;
            border-bottom-left-radius: 4px;
            border: 0.5px solid #e8e8e8;
        }
        .message.bot .bav {
            display: inline-block;
            margin-right: 4px;
            font-size: 15px;
        }
        .message .time {
            font-size: 10px;
            opacity: 0.5;
            margin-top: 4px;
            display: block;
            text-align: right;
        }
        .message.user .time { color: rgba(255,255,255,0.6); }

        .message .msg-image {
            max-width: 100%;
            max-height: 240px;
            border-radius: 8px;
            display: block;
            margin-top: 4px;
        }
        .message .img-ph {
            padding: 16px 12px;
            border-radius: 8px;
            background: rgba(0,0,0,0.04);
            border: 0.5px dashed #d9d9d9;
            font-size: 11px;
            color: #8e8e93;
            text-align: center;
            margin-top: 4px;
        }

        .audio-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 12px;
            background: #f5f5f5;
            border-radius: 10px;
            cursor: pointer;
            user-select: none;
            margin-top: 4px;
            min-width: 120px;
        }
        .audio-wrapper .disc {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, #ddd 0%, #bbb 25%, #ddd 50%, #bbb 75%, #ddd 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: transform 0.3s;
        }
        .audio-wrapper .disc.playing { animation: spin 2s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .audio-wrapper .disc::after {
            content: '';
            width: 8px;
            height: 8px;
            background: #3a7bd5;
            border-radius: 50%;
        }
        .audio-wrapper .info { flex: 1; }
        .audio-wrapper .label { font-size: 12px; font-weight: 500; }
        .audio-wrapper .duration { font-size: 10px; color: #8e8e93; }

        .message.bot.typing {
            min-width: 70px;
            padding: 14px 20px;
        }
        .typing-dots {
            display: inline-flex;
            gap: 5px;
            padding: 2px 0;
        }
        .typing-dots span {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #8e8e93;
            animation: blink 1.4s infinite;
        }
        .typing-dots span:nth-child(2) { animation-delay: 0.18s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.36s; }
        @keyframes blink {
            0%, 60%, 100% { opacity: 0.2; transform: scale(0.8); }
            30% { opacity: 1; transform: scale(1); }
        }

        .cursor-blink {
            display: inline-block;
            width: 2px;
            height: 18px;
            background: #3a7bd5;
            animation: blink-cursor 0.8s step-end infinite;
            vertical-align: text-bottom;
            margin-left: 2px;
        }
        @keyframes blink-cursor {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .input-area {
            display: flex;
            gap: 8px;
            padding: 8px 12px 14px;
            border-top: 0.5px solid #d9d9d9;
            background: #ffffff;
            flex-shrink: 0;
            align-items: flex-end;
        }
        .input-area textarea {
            flex: 1;
            background: #f5f5f5;
            border: 0.5px solid #e0e0e0;
            border-radius: 20px;
            padding: 10px 14px;
            font-size: 15px;
            color: #1a1a1a;
            resize: none;
            height: 42px;
            max-height: 80px;
            font-family: inherit;
            line-height: 1.4;
            outline: none;
            transition: border-color 0.2s;
        }
        .input-area textarea:focus { border-color: #3a7bd5; background: #ffffff; }
        .input-area textarea::placeholder { color: #b0b0b0; }
        .input-area textarea:disabled { opacity: 0.5; cursor: not-allowed; }
        .input-area button {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: none;
            background: #3a7bd5;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            flex-shrink: 0;
            transition: background 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .input-area button:active { transform: scale(0.92); }
        .input-area button:disabled { opacity: 0.3; cursor: not-allowed; }

        .toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.75);
            color: #fff;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 13px;
            z-index: 200;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            font-family: -apple-system, "PingFang SC", sans-serif;
        }
        .toast.show { opacity: 1; }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            display: none;
            align-items: flex-start;
            justify-content: center;
            z-index: 150;
            padding: 60px 20px 20px;
        }
        .modal-overlay.show { display: flex; }
        .modal {
            background: #ffffff;
            border-radius: 14px;
            padding: 20px;
            width: 100%;
            max-width: 380px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 8px 32px rgba(0,0,0,0.15);
        }
        .modal .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .modal .modal-header h3 { font-size: 16px; font-weight: 600; color: #1a1a1a; }
        .modal .modal-header .close {
            font-size: 20px;
            color: #8e8e93;
            cursor: pointer;
            border: none;
            background: none;
            font-family: inherit;
        }
        .modal .search-input {
            width: 100%;
            padding: 10px 14px;
            border: 0.5px solid #d9d9d9;
            border-radius: 10px;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            margin-bottom: 12px;
        }
        .modal .search-input:focus { border-color: #3a7bd5; }
        .modal .search-results {
            flex: 1;
            overflow-y: auto;
            max-height: 300px;
        }
        .modal .search-results::-webkit-scrollbar { width: 0; display: none; }
        .modal .result-item {
            padding: 8px 12px;
            border-bottom: 0.5px solid #f0f0f0;
            cursor: pointer;
            border-radius: 6px;
        }
        .modal .result-item:active { background: #f5f5f5; }
        .modal .result-item .who { font-size: 12px; font-weight: 500; color: #1a1a1a; }
        .modal .result-item .when { font-size: 10px; color: #8e8e93; margin-left: 8px; }
        .modal .result-item .text {
            font-size: 13px;
            color: #333;
            margin-top: 2px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .modal .result-item .text b { color: #3a7bd5; }
        .modal .no-result {
            padding: 20px;
            text-align: center;
            color: #8e8e93;
            font-size: 13px;
        }

        .modal .pwd-input {
            width: 100%;
            padding: 10px 14px;
            border: 0.5px solid #d9d9d9;
            border-radius: 10px;
            font-size: 16px;
            text-align: center;
            letter-spacing: 6px;
            font-family: inherit;
            outline: none;
            margin-bottom: 12px;
        }
        .modal .pwd-input:focus { border-color: #3a7bd5; }
        .modal .modal-actions {
            display: flex;
            gap: 10px;
        }
        .modal .modal-actions button {
            flex: 1;
            padding: 10px;
            border-radius: 10px;
            border: none;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            font-family: inherit;
        }
        .modal .modal-actions .btn-cancel { background: #f5f5f5; color: #666; }
        .modal .modal-actions .btn-cancel:active { background: #e8e8e8; }
        .modal .modal-actions .btn-confirm { background: #ff3b30; color: #fff; }
        .modal .modal-actions .btn-confirm:active { background: #d63031; }
        .modal .modal-actions .btn-primary { background: #3a7bd5; color: #fff; }
        .modal .modal-actions .btn-primary:active { background: #2b5ca8; }
    </style>
</head>

// ===== 获取当前状态 =====
function getCurrentStatus(personaId, now) {
    now = now || new Date();
    const weekday = now.getDay(); // 0=周日, 1=周一...
    const total = now.getHours() * 60 + now.getMinutes();

    // 小舒特殊处理
    if (personaId === 'xiaoshu') {
        const labels = ['在', '我在', '我一直在', '我24小时都在', '在线待命', '随时为您服务'];
        return {
            level: 1,
            icon: '🏛️',
            label: labels[Math.floor(Math.random() * labels.length)],
            prefixKey: null
        };
    }

    const schedule = WEEKLY_SCHEDULES[personaId];
    if (!schedule || !schedule[weekday]) {
        return { level: 1, icon: '💬', label: '在线', prefixKey: null };
    }

    const daySchedule = schedule[weekday];
    let current = null;
    let prefixKey = null;

    for (const slot of daySchedule) {
        const [startStr, endStr, level, icon, label] = slot;
        const startMin = parseTimeToMinutes(startStr);
        const endMin = parseTimeToMinutes(endStr);
        if (total >= startMin && total < endMin) {
            current = { level, icon, label };
            // 判断 prefixKey（用于挡2加前缀）
            const prefixMap = {
                '🪥': 'wake', '🍳': 'cook', '🚇': 'commute', '🚗': 'commute', '🚲': 'commute',
                '🍜': 'lunch', '🍚': 'dinner', '🍷': 'dinner', '🍵': 'free',
                '🛁': 'night', '💄': 'free', '🎵': 'free', '🎤': 'sing'
            };
            prefixKey = prefixMap[icon] || 'free';
            break;
        }
    }

    if (!current && daySchedule.length > 0) {
        const last = daySchedule[daySchedule.length - 1];
        current = { level: last[2], icon: last[3], label: last[4] };
        const prefixMap = {
            '🪥': 'wake', '🍳': 'cook', '🚇': 'commute', '🚗': 'commute', '🚲': 'commute',
            '🍜': 'lunch', '🍚': 'dinner', '🍷': 'dinner', '🍵': 'free',
            '🛁': 'night', '💄': 'free', '🎵': 'free', '🎤': 'sing'
        };
        prefixKey = prefixMap[current.icon] || 'free';
    }

    if (!current) {
        return { level: 1, icon: '💬', label: '在线', prefixKey: null };
    }

    return {
        level: current.level,
        icon: current.icon,
        label: current.label,
        prefixKey: prefixKey
    };
}

// ===== 获取挡2前缀文案 =====
function getPrefixText(prefixKey, personaId) {
    if (!prefixKey) return null;
    const schedule = WEEKLY_SCHEDULES[personaId];
    if (!schedule || !schedule.prefixTexts) return null;

    // 根据 prefixKey 找对应的图标
    const iconMap = {
        'wake': ['🪥'],
        'cook': ['🍳'],
        'commute': ['🚇', '🚗', '🚲'],
        'lunch': ['🍜'],
        'dinner': ['🍚', '🍷'],
        'night': ['🛁'],
        'free': ['💄', '🍵', '🎵'],
        'sing': ['🎤']
    };
    const icons = iconMap[prefixKey] || [];
    const texts = [];
    for (const icon of icons) {
        if (schedule.prefixTexts[icon]) {
            texts.push(...schedule.prefixTexts[icon]);
        }
    }
    if (texts.length === 0) return null;
    return texts[Math.floor(Math.random() * texts.length)];
}

function getDefaultReply(personaId) {
    const now = new Date();

// ===== 获取排班描述（供System Prompt注入） =====
function getScheduleDescription(personaId, date) {
    const targetDate = (date instanceof Date) ? date : new Date();
    const weekday = targetDate.getDay();
    const total = targetDate.getHours() * 60 + targetDate.getMinutes();
    const schedule = WEEKLY_SCHEDULES[personaId];

    if (personaId === 'xiaoshu') return '🏛️ 全天在线';
    if (!schedule || !schedule[weekday]) return '自由活动';

    const daySchedule = schedule[weekday];
    let current = null;
    for (const slot of daySchedule) {
        const [startStr, endStr, level, icon, label] = slot;
        const startMin = parseTimeToMinutes(startStr);
        const endMin = parseTimeToMinutes(endStr);
        if (total >= startMin && total < endMin) {
            current = { icon, label };
            break;
        }
    }
    if (!current && daySchedule.length > 0) {
        const last = daySchedule[daySchedule.length - 1];
        current = { icon: last[3], label: last[4] };
    }
    return current ? current.icon + ' ' + current.label : '自由活动';
}

const SOLAR_TERMS = {
    '01-05': '小寒', '01-20': '大寒', '02-04': '立春', '02-19': '雨水',
    '03-05': '惊蛰', '03-20': '春分', '04-04': '清明', '04-20': '谷雨',

    '04-01': '愚人节', '05-01': '劳动节', '05-04': '青年节', '06-01': '儿童节',

    '10-31': '万圣节', '12-24': '平安夜', '12-25': '圣诞节'
};
const LUNAR_HOLIDAYS = {
    2024: { '春节': '02-10', '元宵节': '02-24', '端午节': '06-10', '七夕节': '08-10', '中秋节': '09-17', '重阳节': '10-11' },
    2025: { '春节': '01-29', '元宵节': '02-12', '端午节': '05-31', '七夕节': '08-29', '中秋节': '10-06', '重阳节': '10-29' },
    2026: { '春节': '02-17', '元宵节': '03-03', '端午节': '06-19', '七夕节': '08-19', '中秋节': '09-25', '重阳节': '10-18' }
};

function getTimeInfo() {
    const now = new Date();
    const year = now.getFullYear(),
        month = now.getMonth() + 1,
        day = now.getDate();
    const hour = now.getHours(),
        minute = now.getMinutes(),
        second = now.getSeconds();
    const weekday = now.getDay();
    const weekdays = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
    const dateKey = String(month).padStart(2, '0') + '-' + String(day).padStart(2, '0');
    const seasons = [{ name: '春', months: [3, 4, 5] }, { name: '夏', months: [6, 7, 8] }, { name: '秋', months: [9, 10, 11] }, { name: '冬', months: [12, 1, 2] }];
    const season = (seasons.find(s => s.months.includes(month)) || {}).name || '冬';
    const ampm = hour < 12 ? '上午' : '下午';
    const term = SOLAR_TERMS[dateKey] || null;
    const yearMap = buildYearHolidayMap(year);
    let holidaysToday = (yearMap[dateKey] && yearMap[dateKey].length) ? [...yearMap[dateKey]] : null;
    const isUserBirthday = !!(holidaysToday && holidaysToday.includes('男朋友生日'));
    if (isUserBirthday) { holidaysToday = ['男朋友生日', ...holidaysToday.filter(n => n !== '男朋友生日')]; }
    const holiday = holidaysToday ? holidaysToday.join('、') : null;
    return { now, year, month, day, hour, minute, second, weekday: weekdays[weekday], ampm, dateKey, season, term, holiday, holidaysToday, isUserBirthday, isWeekend: weekday === 0 || weekday === 6 };
}

function buildYearHolidayMap(year) {
    const map = {};
    const addHoliday = (k, n) => { if (!map[k]) map[k] = [];
        if (!map[k].includes(n)) map[k].push(n); };
    for (const [k, v] of Object.entries(HOLIDAYS_FIXED)) addHoliday(k, v);
    const lunar = LUNAR_HOLIDAYS[year] || LUNAR_HOLIDAYS[2026];
    for (const [n, k] of Object.entries(lunar)) addHoliday(k, n);
    for (const [k, n] of Object.entries(SOLAR_TERMS)) {
        if (['清明', '冬至', '立春', '立夏', '立秋', '立冬'].includes(n)) addHoliday(k, n + '节气');
    }
    const userBDMap = { 2024: '11-26', 2025: '12-16', 2026: '12-05' };
    const bd = userBDMap[year];
    if (bd) addHoliday(bd, '男朋友生日');
    return map;
}

const cardPiles = {};

function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}

function getCardPile(slot, type) {
    const key = slot + '_' + type;
    if (!cardPiles[key]) {
        let files = [];
        const manifest = window.assetManifest;
        if (manifest && manifest.slots && manifest.slots[slot]) {
            if (type === 'work') {
                files = manifest.slots[slot].img.work || [];
            } else if (type === 'private') {
                files = manifest.slots[slot].img.private || [];
            }
        }
        if (files.length === 0) {
            const fallbackCount = { a: 30, b: 30, c: 33, d: 0 };
            const count = fallbackCount[slot] || 5;
            for (let i = 1; i <= count; i++) {
                files.push(i + '.jpg');
            }
        }
        cardPiles[key] = {
            deck: shuffle(files),
            discard: []
        };
        console.log('🃏 创建牌堆:', key, '共', files.length, '张');
    }
    return cardPiles[key];
}

function drawImage(slot, type) {
    const pile = getCardPile(slot, type);
    if (pile.deck.length === 0) {
        if (pile.discard.length === 0) {
            console.warn('⚠️ 没有图片可抽');
            return null;
        }
        pile.deck = shuffle(pile.discard);
        pile.discard = [];
        console.log('🔄 牌堆已重置（所有图片已发完）');
    }
    const file = pile.deck.pop();
    pile.discard.push(file);
    return './' + slot + '/img/' + type + '/' + file;
}

function checkKeywords(text) {
    if (!profileData || !profileData.keyword_triggers) return null;
    const kt = profileData.keyword_triggers;

    if (kt.normal_photo && Array.isArray(kt.normal_photo)) {
        for (const group of kt.normal_photo) {

            for (const kw of group.keywords) {
                if (text.includes(kw) && Math.random() < (group.probability || 0.5)) {

                    if (path) {
                        console.log('📷 触发图片:', path);
                        return { type: 'image', content: path };
                    }
                }
            }
        }
    }

    if (kt.normal_audio && kt.normal_audio.keywords) {
        const na = kt.normal_audio;
        for (const kw of na.keywords) {
            if (text.includes(kw) && Math.random() < (na.probability || 0.5)) {
                return { type: 'audio', content: '__tts__' };
            }
        }
    }

    if (kt.hidden_photo && Array.isArray(kt.hidden_photo)) {
        for (const group of kt.hidden_photo) {
            if (!group.keywords) continue;
            for (const kw of group.keywords) {
                if (text.includes(kw) && Math.random() < (group.probability || 0.3)) {

                        console.log('🔒 触发私密图片:', path);

            }
        }
    }

    return null;
}

function buildSystemPrompt(userText, weather) {
    if (!systemPrompt) return '你是一个友好的AI助手。';
    const timeInfo = getTimeInfo();
    const weekdays = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
    const now = new Date();

    let prompt = systemPrompt;
    prompt += `\n\n📅 日期信息：\n今天（${timeInfo.month}月${timeInfo.day}日 ${weekdays[timeInfo.weekday]}）：${getScheduleDescription(PERSONA_ID, now)}`;
    const tomorrow = new Date(now);
    tomorrow.setDate(tomorrow.getDate() + 1);
    const dayAfter = new Date(now);
    dayAfter.setDate(dayAfter.getDate() + 2);
    prompt += `\n明天（${tomorrow.getMonth()+1}月${tomorrow.getDate()}日 ${weekdays[tomorrow.getDay()]}）：${getScheduleDescription(PERSONA_ID, tomorrow)}`;
    prompt += `\n后天（${dayAfter.getMonth()+1}月${dayAfter.getDate()}日 ${weekdays[dayAfter.getDay()]}）：${getScheduleDescription(PERSONA_ID, dayAfter)}`;
    prompt += `\n当用户问到「明天」「后天」「几号」「星期几」时，请根据上面提供的日期信息准确回答。`;

    if (timeInfo.term) prompt += `\n今日节气：${timeInfo.term}`;
    if (timeInfo.holiday) prompt += `\n今日节日：${timeInfo.holiday}`;

    const status = getCurrentStatus(PERSONA_ID, now);
    prompt += `\n${current.name}当前状态：${status.icon} ${status.label}`;
    prompt += `\n虚构城市：舒心市；真实天气查询城市：${WEATHER_CITY}`;

    if (weather) {
        if (weather.fallback) prompt += `\n天气：${weather.fallback}`;
        else prompt += `\n当前${WEATHER_CITY}的天气：${weather.condition}，${weather.temperature}`;
    }

    prompt += `\n\n你（${current.name}）称呼用户为「${profileData?.personality?.call_user || '宝贝'}」，自称「${profileData?.personality?.self_call || '我'}」。`;
    prompt += `\n回复自然简短，不要超过200字。`;

    // 强制排班铁则
    prompt += `\n\n【⚠️ 最高优先级 · 必须遵守】`;
    prompt += `\n1. 上述「📅 日期信息」中已经注明了你今天的真实排班，你必须严格按照这个信息回答关于排班、上班、下班的问题。`;
    prompt += `\n2. 绝对禁止自己编造排班信息！如果用户问你今天上什么班，你必须直接引用上面「今天」后面的排班描述。`;
    prompt += `\n3. 如果上面的排班信息显示「休息」，你就说今天休息；如果显示「早班」或「中班」或「夜班」，你就如实回答。`;
    prompt += `\n4. 不要用「我记得」「好像」「应该是」这类模糊词。`;

    // ===== 🔥 新增：强制注入今天真实日期（最高优先级） =====
    const todayStr = weekdays[now.getDay()];
    const todayDateStr = `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日`;
    prompt += `\n\n【🚨 最高优先级 · 今天真实日期】`;
    prompt += `\n今天是 ${todayStr}（${todayDateStr}），绝对不要回答成其他日子！`;
    prompt += `\n当用户问「今天周几」「今天几号」时，必须回答「${todayStr}」！`;
    prompt += `\n这是系统注入的准确日期，不是你记忆中的！`;

    return prompt;
}

function getContextMessages() {
    const MAX_CONTEXT = 60;
    const recent = messages.slice(-MAX_CONTEXT);
    return recent.filter(msg => msg.type === 'text' || msg.type === undefined);
}

async function callDeepSeekStream(userText, onChunk, onComplete, onError) {
    const apiKey = localStorage.getItem('ai_api_key');
    if (!apiKey) {
        onError('请先配置 DeepSeek API Key（在「我的」→ API 配置中设置）');
        return;
    }

    let weather = null;
    if (/天气|温度|热|冷|下雨|雨|雪|风|出门|穿衣|预报|晴|阴/.test(userText)) {
        try { weather = await fetchWeather(); } catch (e) {}
    }

    const prompt = buildSystemPrompt(userText, weather);
    const context = getContextMessages();

    const messagesArr = [
        { role: 'system', content: prompt },
        ...context.map(msg => ({
            role: msg.role === 'user' ? 'user' : 'assistant',
            content: msg.text || msg.content || ''
        })),
        { role: 'user', content: userText }
    ];

    try {
        const resp = await fetch('https://api.deepseek.com/v1/chat/completions', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + apiKey
            },
            body: JSON.stringify({
                model: 'deepseek-chat',
                messages: messagesArr,
                max_tokens: 400,
                temperature: 0.85,
                stream: true
            })
        });

        if (!resp.ok) {
            const errText = await resp.text();
            onError('API 错误：' + resp.status + ' ' + errText);
            return;
        }

        const reader = resp.body.getReader();
        const decoder = new TextDecoder();
        let fullText = '';

        while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            const chunk = decoder.decode(value);
            const lines = chunk.split('\n').filter(line => line.trim() !== '');
            for (const line of lines) {
                if (line.startsWith('data: ')) {
                    const data = line.slice(6);
                    if (data === '[DONE]') continue;
                    try {
                        const parsed = JSON.parse(data);
                        const delta = parsed.choices?.[0]?.delta?.content;
                        if (delta) {
                            fullText += delta;
                            onChunk(delta);
                        }
                    } catch (e) {}
                }
            }
        }

        onComplete(fullText);
    } catch (e) {
        onError('网络错误：' + e.message);
    }
}

function getTime() {
    return new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
}

function formatTime(timestamp) {
    if (!timestamp) return getTime();
    const d = new Date(timestamp);
    if (isNaN(d.getTime())) return getTime();
    const now = new Date();
    const sameDay = d.getFullYear() === now.getFullYear() &&
        d.getMonth() === now.getMonth() &&
        d.getDate() === now.getDate();
    if (sameDay) {
        return d.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
    }
    const yesterday = new Date(now);
    yesterday.setDate(yesterday.getDate() - 1);
    const isYesterday = d.getFullYear() === yesterday.getFullYear() &&
        d.getMonth() === yesterday.getMonth() &&
        d.getDate() === yesterday.getDate();
    const hhmm = d.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
    if (isYesterday) return '昨天 ' + hhmm;
    return d.toLocaleDateString('zh-CN', { month: '2-digit', day: '2-digit' }) + ' ' + hhmm;
}

        return;
    }
    messages = JSON.parse(JSON.stringify(clearedBackup));
    setClearedStatus(false);
    saveMessages();
    renderMessages();
    showToast('↩️ 已恢复');
}

function renderMessages() {
    const area = document.getElementById('messageArea');
    area.innerHTML = '';

    if (getClearedStatus()) {
        area.innerHTML =
            `<div class="clear-hint"><div class="icon">🧹</div>已清屏 · 点击右上角「恢复清屏」可恢复</div>`;
        return;
    }

    if (!messages || messages.length === 0) {
        area.innerHTML =
            `<div class="clear-hint"><div class="icon">💬</div>还没有聊天记录<br>发送一条消息开始吧</div>`;
        return;
    }

    messages.forEach((msg) => {
        const div = document.createElement('div');
        const isUser = msg.role === 'user' || msg.role === 'me';
        div.className = 'message ' + (isUser ? 'user' : 'bot');

        if (msg.type === 'image') {
            const src = msg.src || msg.content;
            if (isUser) {
                div.innerHTML = `<img src="${src}" class="msg-image" onerror="this.outerHTML='<div class=\\'img-ph\\'>🖼️ 图片加载失败</div>'">`;
            } else {
                const text = msg.text || '';
                div.innerHTML = `<span class="bav">${current.emoji}</span>${text ? text : ''}<img src="${src}" class="msg-image" onerror="this.outerHTML='<div class=\\'img-ph\\'>🖼️ 图片加载失败</div>'">`;
            }
        } else if (msg.type === 'audio') {
            const src = msg.src || msg.content;
            const audioHTML = createAudioUI(src, msg.duration);
            if (isUser) {
                div.innerHTML = audioHTML;
            } else {
                const text = msg.text || '';
                div.innerHTML = `<span class="bav">${current.emoji}</span>${text ? text : ''}${audioHTML}`;
            }
        } else {
            const text = msg.text || msg.content || '';
            if (isUser) {
                div.textContent = text;
            } else {
                div.innerHTML = `<span class="bav">${current.emoji}</span> ${text}`;
            }
        }

        const timeSpan = document.createElement('span');
        timeSpan.className = 'time';
        timeSpan.textContent = formatTime(msg.time);
        div.appendChild(timeSpan);
        area.appendChild(div);
    });

    area.scrollTop = area.scrollHeight;
}

function createAudioUI(src, duration) {
    const wrapper = document.createElement('div');
    wrapper.className = 'audio-wrapper';
    const disc = document.createElement('div');
    disc.className = 'disc';
    const info = document.createElement('div');
    info.className = 'info';
    const label = document.createElement('div');
    label.className = 'label';
    label.textContent = '语音消息';
    const durSpan = document.createElement('div');
    durSpan.className = 'duration';
    durSpan.textContent = duration ? Math.round(duration) + '"' : '…';
    info.appendChild(label);
    info.appendChild(durSpan);
    wrapper.appendChild(disc);
    wrapper.appendChild(info);

    if (src === '__audio_placeholder__' || src === '__tts__') {
        wrapper.style.opacity = '0.5';
        wrapper.style.cursor = 'not-allowed';
        durSpan.textContent = '需配置TTS';
        wrapper.onclick = () => showToast('请先配置 TTS API Key');
        return wrapper.outerHTML;
    }

    const audio = new Audio();
    audio.src = src;
    audio.preload = 'metadata';
    let isPlaying = false;

    audio.addEventListener('loadedmetadata', () => {
        if (audio.duration && audio.duration > 0) {
            durSpan.textContent = Math.round(audio.duration) + '"';
        }
    });

    wrapper.onclick = function(e) {
        e.stopPropagation();
        if (currentAudio && currentAudio !== audio) {
            currentAudio.pause();
            const oldDisc = currentAudio._wrapper?.querySelector('.disc');
            if (oldDisc) oldDisc.classList.remove('playing');
        }
        if (isPlaying) {
            audio.pause();
        } else {
            audio.currentTime = 0;
            audio.play().catch(() => {});
            disc.classList.add('playing');
            label.textContent = '播放中...';
        }
    };

    audio.addEventListener('play', () => { isPlaying = true;
        currentAudio = audio;
        audio._wrapper = wrapper; });
    audio.addEventListener('pause', () => {
        isPlaying = false;
        disc.classList.remove('playing');
        label.textContent = '语音消息';
        if (currentAudio === audio) currentAudio = null;
    });
    audio.addEventListener('ended', () => {
        isPlaying = false;
        disc.classList.remove('playing');
        label.textContent = '语音消息';
        if (currentAudio === audio) currentAudio = null;
    });

    return wrapper.outerHTML;
}

function addMessage(role, opts) {
    const msg = {
        role: role,
        type: opts.type || 'text',
        text: opts.text || '',
        content: opts.content || opts.text || '',
        time: Date.now()
    };
    if (opts.image) { msg.image = opts.image;
        msg.src = opts.image;
        msg.type = 'image'; }
    if (opts.audio) { msg.audio = opts.audio;
        msg.src = opts.audio;
        msg.type = 'audio'; }
    if (opts.duration) { msg.duration = opts.duration; }
    messages.push(msg);
    saveMessages();
    renderMessages();
}

function showTyping() {
    const area = document.getElementById('messageArea');
    const div = document.createElement('div');
    div.className = 'message bot typing';
    div.id = 'typingIndicator';
    div.innerHTML = `<div class="typing-dots"><span></span><span></span><span></span></div>`;
    area.appendChild(div);
    area.scrollTop = area.scrollHeight;
}

function removeTyping() {
    const el = document.getElementById('typingIndicator');
    if (el) el.remove();
}

// ================================================================
//  第九部分：发送消息（核心）
// ================================================================

async function sendMessage() {
    updateHeaderStatus();
    const input = document.getElementById('inputBox');
    const text = input.value.trim();
    if (!text) return;
    if (isWaiting) { showToast('⏳ 正在回复中，请稍候'); return; }

    // 1. 关键词触发
    const keywordResult = checkKeywords(text);
    if (keywordResult) {
        addMessage('user', { type: 'text', text: text });
        input.value = '';
        input.style.height = '42px';
        if (keywordResult.type === 'image') {
            const imgPath = keywordResult.content;
            if (imgPath) {
                addMessage('bot', { type: 'image', image: imgPath, text: '给你看～' });
            } else {
                addMessage('bot', { type: 'text', text: '我翻遍了相册，没找到合适的照片～下次再给你看吧 😊' });
            }
        } else if (keywordResult.type === 'audio') {
            showTyping();
            const ttsText = '你好呀～我是' + current.name + '，很高兴和你聊天～';
            const audioUrl = await callTTS(ttsText);
            removeTyping();
            if (audioUrl) {
                addMessage('bot', { type: 'audio', src: audioUrl, text: '' });
            } else {
                addMessage('bot', { type: 'text', text: '我突然嗓子不舒服…下次再说给你听好不好～ 😣' });
            }
        }
        return;
    }

    // 2. 检查是否睡觉（挡3）
    const now = new Date();
    const status = getCurrentStatus(PERSONA_ID, now);
    if (status.level === 3) {
        addMessage('user', { type: 'text', text: text });
        input.value = '';
        input.style.height = '42px';
        addMessage('bot', { type: 'text', text: getDefaultReply(PERSONA_ID) });
        return;
    }

    // 3. 正常发送
    addMessage('user', { type: 'text', text: text });
    input.value = '';
    input.style.height = '42px';

    // 检查挡2
    const isSlow = (status.level === 2);
    const prefixText = isSlow ? getPrefixText(status.prefixKey, PERSONA_ID) : null;

    isWaiting = true;
    document.getElementById('sendBtn').disabled = true;

    const streamMsg = document.createElement('div');
    streamMsg.className = 'message bot';
    streamMsg.id = 'streamingMessage';
    streamMsg.innerHTML = `<span class="bav">${current.emoji}</span> <span id="streamContent"></span><span class="cursor-blink"></span>`;
    const area = document.getElementById('messageArea');
    area.appendChild(streamMsg);
    area.scrollTop = area.scrollHeight;

    let fullReply = '';

    if (isSlow && prefixText) {
        const prefixSpan = document.createElement('span');
        prefixSpan.style.color = '#ff9800';
        prefixSpan.textContent = prefixText + ' ';
        document.getElementById('streamContent').appendChild(prefixSpan);
        fullReply = prefixText + ' ';
    }

    await callDeepSeekStream(
        text,
        (chunk) => {
            const content = document.getElementById('streamContent');
            const textNode = document.createTextNode(chunk);
            content.appendChild(textNode);
            fullReply += chunk;
            area.scrollTop = area.scrollHeight;
        },
        (finalText) => {
            const streamEl = document.getElementById('streamingMessage');
            if (streamEl) {
                streamEl.querySelector('.cursor-blink')?.remove();
                const content = streamEl.querySelector('#streamContent');
                if (content) {
                    content.textContent = fullReply;
                }
                const timeSpan = document.createElement('span');
                timeSpan.className = 'time';
                timeSpan.textContent = formatTime(Date.now());
                streamEl.appendChild(timeSpan);
                streamEl.id = '';
                const replyText = fullReply.trim();
                messages.push({ role: 'bot', text: replyText, time: Date.now() });
                saveMessages();
                isWaiting = false;
                document.getElementById('sendBtn').disabled = false;
                area.scrollTop = area.scrollHeight;
            }
        },
        (errorMsg) => {
            const streamEl = document.getElementById('streamingMessage');
            if (streamEl) {
                const content = streamEl.querySelector('#streamContent');
                if (content) {
                    content.textContent = '⚠️ ' + errorMsg;
                }
                streamEl.querySelector('.cursor-blink')?.remove();
                const timeSpan = document.createElement('span');
                timeSpan.className = 'time';
                timeSpan.textContent = formatTime(Date.now());
                streamEl.appendChild(timeSpan);
                streamEl.id = '';
            }
            isWaiting = false;
            document.getElementById('sendBtn').disabled = false;
            showToast('⚠️ ' + errorMsg);
        }
    );
}

// ================================================================
//  第十部分：菜单功能
// ================================================================

let menuOpen = false;

function toggleMenu(e) {
    e.stopPropagation();
    menuOpen = !menuOpen;
    document.getElementById('menuDropdown').classList.toggle('open', menuOpen);
}

function closeMenu() {
    menuOpen = false;
    document.getElementById('menuDropdown').classList.remove('open');
}

function showSearchModal() {
    const overlay = document.getElementById('modalOverlay');
    const content = document.getElementById('modalContent');
    content.innerHTML = `
        <div class="modal-header">
            <h3>🔍 搜索聊天记录</h3>
            <button class="close" onclick="closeModal()">✕</button>
        </div>
        <input class="search-input" id="searchInput" placeholder="输入关键词…" autofocus>
        <div class="search-results" id="searchResults">
            <div class="no-result">输入关键词开始搜索</div>
        </div>
    `;
    overlay.classList.add('show');
    setTimeout(() => document.getElementById('searchInput').focus(), 100);

    document.getElementById('searchInput').addEventListener('input', function() {
        const keyword = this.value.trim().toLowerCase();
        const results = document.getElementById('searchResults');
        if (!keyword) {
            results.innerHTML = '<div class="no-result">输入关键词开始搜索</div>';
            return;
        }
        const allMsgs = getClearedStatus() ? clearedBackup : messages;
        const matches = allMsgs.filter(msg => {
            const text = (msg.text || msg.content || '').toString().toLowerCase();
            return text.includes(keyword);
        });
        if (matches.length === 0) {
            results.innerHTML = '<div class="no-result">未找到匹配记录</div>';
            return;
        }
        results.innerHTML = matches.map((m, idx) => `
            <div class="result-item" onclick="jumpToMessage(${idx})">
                <div>
                    <span class="who">${m.role === 'user' ? '🧑 我' : '👤 ' + current.name}</span>
                    <span class="when">${formatTime(m.time)}</span>
                </div>
                <div class="text">${highlightText((m.text || m.content || '').toString(), keyword)}</div>
            </div>
        `).join('');
    });
}

function highlightText(text, keyword) {
    const regex = new RegExp('(' + keyword.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
    return text.replace(regex, '<b>$1</b>');
}

function jumpToMessage(idx) {
    closeModal();
    if (getClearedStatus()) restoreScreen();
    setTimeout(() => {
        const area = document.getElementById('messageArea');
        const items = area.querySelectorAll('.message');
        if (items[idx]) {
            items[idx].scrollIntoView({ behavior: 'smooth', block: 'center' });
            items[idx].style.transition = 'background 0.3s';
            items[idx].style.background = 'rgba(58, 123, 213, 0.15)';
            setTimeout(() => { items[idx].style.background = ''; }, 1500);
        }
    }, 100);
}

function clearAllChat() {
    showPasswordModal('🗑️ 清除聊天记录', '确定要永久删除与「' + current.name + '」的所有聊天记录吗？此操作不可恢复！', function(password) {
        if (password === 'wlaoshi520') {
            messages = [];
            saveMessages();
            setClearedStatus(false);
            clearedBackup = [];
            renderMessages();
            showToast('🗑️ 已清除所有聊天记录');
        } else {
            showToast('❌ 密码错误');
        }
    });
}

function showPasswordModal(title, message, callback) {
    const overlay = document.getElementById('modalOverlay');
    const content = document.getElementById('modalContent');
    content.innerHTML = `
        <div class="modal-header">
            <h3>${title}</h3>
            <button class="close" onclick="closeModal()">✕</button>
        </div>
        <p style="font-size:13px;color:#666;margin-bottom:12px;">${message}</p>
        <input class="pwd-input" id="pwdInput" type="password" placeholder="请输入密码" autofocus>
        <div class="modal-actions">
            <button class="btn-cancel" onclick="closeModal()">取消</button>
            <button class="btn-confirm" id="pwdConfirm">确定</button>
        </div>
    `;
    overlay.classList.add('show');
    setTimeout(() => document.getElementById('pwdInput').focus(), 100);

    document.getElementById('pwdConfirm').onclick = function() {
        const pwd = document.getElementById('pwdInput').value;
        closeModal();
        callback(pwd);
    };
    document.getElementById('pwdInput').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') document.getElementById('pwdConfirm').click();
    });
}

function closeModal() {
    document.getElementById('modalOverlay').classList.remove('show');
}
document.getElementById('modalOverlay').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
});

function goBack() {
    if (window.history.length > 1) window.history.back();
    else location.href = 'index.html';
}

// ================================================================
//  第十一部分：今日日程
// ================================================================

function showTodaySchedule() {
    const now = new Date();
    const status = getCurrentStatus(PERSONA_ID, now);
    const timeInfo = getTimeInfo();
    const weekdays = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
    const schedule = WEEKLY_SCHEDULES[PERSONA_ID];
    const weekday = now.getDay();

    if (PERSONA_ID === 'xiaoshu') {
        showToast('小舒24小时全天在线');
        return;
    }

    if (!schedule || !schedule[weekday]) {
        showToast('暂无日程数据');
        return;
    }

    let timelineHtml = '';
    for (const slot of schedule[weekday]) {
        const [startStr, endStr, level, icon, label] = slot;
        const levelLabel = level === 1 ? '正常' : level === 2 ? '回复慢' : '不回复';
        timelineHtml += `
            <div style="display:flex;align-items:center;padding:5px 0;border-bottom:0.5px solid #f0f0f0;font-size:12px;">
                <span style="min-width:85px;color:#8e8e93;">${startStr} - ${endStr}</span>
                <span style="margin:0 6px;">${icon}</span>
                <span style="flex:1;">${label}</span>
                <span style="font-size:10px;color:${level === 1 ? '#4caf50' : level === 2 ? '#ff9800' : '#7c4dff'};">${levelLabel}</span>
            </div>
        `;
    }

    const overlay = document.getElementById('modalOverlay');
    const content = document.getElementById('modalContent');
    content.innerHTML = `
        <div class="modal-header">
            <h3>📅 ${current.name} 今日日程（${timeInfo.month}月${timeInfo.day}日 ${weekdays[weekday]}）</h3>
            <button class="close" onclick="closeModal()">✕</button>
        </div>
        <div style="max-height:400px;overflow-y:auto;">
            ${timelineHtml}
        </div>
        <div style="margin-top:10px;padding:8px 10px;background:#f5f5f5;border-radius:8px;font-size:12px;color:#8e8e93;">
            💡 当前状态：${status.icon} ${status.label}
        </div>
    `;
    overlay.classList.add('show');
}

// ================================================================
//  第十二部分：初始化
// ================================================================

document.getElementById('menuBtn').addEventListener('click', toggleMenu);
document.addEventListener('click', function(e) {
    if (menuOpen && !e.target.closest('.menu-wrapper')) closeMenu();
});

document.querySelectorAll('.menu-dropdown .item').forEach(item => {
    item.addEventListener('click', function(e) {
        e.stopPropagation();
        closeMenu();
        const action = this.dataset.action;
        if (action === 'search') showSearchModal();
        else if (action === 'clearscreen') clearScreen();
        else if (action === 'restorescreen') restoreScreen();
        else if (action === 'schedule') showTodaySchedule();
        else if (action === 'clear') clearAllChat();
    });
});

document.getElementById('sendBtn').addEventListener('click', sendMessage);
document.getElementById('inputBox').addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
    }
});
document.getElementById('inputBox').addEventListener('input', function() {
    this.style.height = '42px';
    this.style.height = Math.min(this.scrollHeight, 80) + 'px';
});

async function init() {
    await loadProfile();
    await loadManifest();

    // 设置头像
    const avatarPath = getAvatarPath();
    document.getElementById('chatAvatar').innerHTML =
        `<img src="${avatarPath}" alt="${current.name}" onerror="this.style.display='none';this.parentElement.textContent='${current.emoji}'" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">`;

    document.getElementById('chatName').textContent = current.name;

    // 初始化状态
    updateHeaderStatus();

    loadMessages();
    isCleared = getClearedStatus();
    if (isCleared) {
        clearedBackup = JSON.parse(JSON.stringify(messages));
        localStorage.setItem('chat_backup_' + SLOT, JSON.stringify(clearedBackup));
    }

    renderMessages();

    // 每分钟更新状态
    setInterval(updateHeaderStatus, 60000);

    console.log('💬 聊天已启动 · ' + current.name);

}

window.goBack = goBack;
window.closeModal = closeModal;
window.jumpToMessage = jumpToMessage;
window.restoreScreen = restoreScreen;

init();
</script>
