<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {

            font-family: -apple-system, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;

            background: none;

            font-weight: 500;

            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            font-family: inherit;
            min-height: 36px;

        }

            color: #5d4037;

        }

        }

        }
        .save-hint .hint-close {
            background: none;
            border: none;
            font-size: 16px;
            color: #b0a090;
            cursor: pointer;
            padding: 0 4px;
            font-family: inherit;
        }

            gap: 8px;

            background: #f8f9fa;
            border-bottom: 1px solid #e8e8e8;
            flex-shrink: 0;

            border-radius: 20px;
            background: #ffffff;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            color: #8e8e93;
            font-family: inherit;
            transition: all 0.15s;

            align-items: center;
            gap: 6px;

            background: #e8f0fe;
            color: #1a1a1a;

            font-weight: 600;

            display: flex;
            justify-content: space-between;
            align-items: center;

            transition: transform 0.2s;
            font-size: 12px;
            color: #b0b0b0;
        }
        .section-header .arrow.open { transform: rotate(180deg); }
        .section-body {
            padding: 12px 14px;
            display: block;
        }

        .form-group:last-child { margin-bottom: 0; }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .form-row-3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
        }

        label {
            display: block;
            font-size: 11px;
            color: #8e8e93;
            margin-bottom: 3px;
            font-weight: 500;
        }
        input[type="text"],
        input[type="number"],
        input[type="date"],
        input[type="time"],
        select,
        textarea {
            width: 100%;
            padding: 7px 10px;
            border: 1px solid #d9d9d9;
            border-radius: 6px;
            font-size: 13px;
            font-family: inherit;
            color: #1a1a1a;
            background: #fafafa;
            outline: none;
            transition: border-color 0.2s;
            min-height: 36px;
        }
        input:focus, select:focus, textarea:focus {
            border-color: #3a7bd5;
            background: #ffffff;

        textarea { resize: vertical; min-height: 60px; font-size: 12px; }

        .hint {
            font-size: 10px;
            color: #b0b0b0;
            margin-top: 2px;
        }

            flex-wrap: wrap;
            gap: 4px;
            padding: 4px 0;

            align-items: center;
            gap: 4px;

            background: #e8f0fe;
            border-radius: 12px;
            font-size: 12px;
            color: #1a1a1a;
            border: 1px solid #d0d9e8;

            color: #b0b0b0;
            font-size: 14px;
            line-height: 1;

            gap: 4px;
            margin-top: 4px;

            padding: 4px 8px;
            border: 1px solid #d9d9d9;
            border-radius: 6px;
            font-size: 12px;
            min-height: 28px;

            background: #3a7bd5;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            font-family: inherit;
            white-space: nowrap;

            display: flex;
            align-items: center;
            gap: 10px;

            -webkit-appearance: none;
            appearance: none;
            height: 4px;
            border-radius: 4px;
            background: #d9d9d9;
            outline: none;
            padding: 0;
            min-height: 4px;

            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #3a7bd5;
            cursor: pointer;
        }
        .prob-value {
            font-size: 13px;
            font-weight: 600;
            color: #3a7bd5;
            min-width: 36px;
            text-align: right;
        }

        /* ===== 排班 ===== */
        .schedule-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
        }
        .schedule-cell {
            text-align: center;
            padding: 6px 2px;
            border-radius: 6px;
            background: #f5f5f5;
            border: 1px solid #e8e8e8;
            cursor: pointer;
            transition: all 0.15s;
            font-size: 10px;
        }
        .schedule-cell:active { transform: scale(0.95); }
        .schedule-cell .dow { font-weight: 600; font-size: 9px; color: #8e8e93; }
        .schedule-cell .shift-name { font-size: 11px; font-weight: 500; }
        .schedule-cell .shift-time { font-size: 8px; color: #8e8e93; }
        .schedule-cell.morning { background: #fff3e0; }
        .schedule-cell.mid { background: #e3f2fd; }
        .schedule-cell.night { background: #e8eaf6; }
        .schedule-cell.off { background: #f5f5f5; }
        .schedule-cell.allday { background: #e8f5e9; }
        .schedule-cell.sing { background: #fce4ec; }
        .schedule-cell.double { background: #f3e5f5; }
        .schedule-cell.today { border-color: #3a7bd5; border-width: 2px; }

        .toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.75);
            color: #fff;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 13px;
            z-index: 2000;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            font-family: -apple-system, "PingFang SC", sans-serif;
        }
        .toast.show { opacity: 1; }

        /* ===== 响应式 ===== */
        @media (max-width: 480px) {
            .form-row { grid-template-columns: 1fr; }
            .form-row-3 { grid-template-columns: 1fr 1fr; }
            .schedule-grid { gap: 3px; }
            .slot-btn { font-size: 12px; padding: 4px 12px; }
            .nav-header .title { font-size: 15px; }
            .nav-header .reset-btn { font-size: 10px; padding: 4px 8px; min-height: 30px; }
            .nav-header .save-btn { font-size: 11px; padding: 4px 12px; min-height: 30px; }
        }
    </style>
</head>

function showToast(msg, duration = 1500) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(el._timer);
    el._timer = setTimeout(() => el.classList.remove('show'), duration);
}

// ================================================================
//  加载数据：优先从 profile.json 读取，失败则使用内置默认值
// ================================================================
async function loadProfile(slot) {
    currentSlot = slot;
    let loaded = false;

    try {
        const resp = await fetch('./' + slot + '/profile.json?t=' + Date.now());
        if (resp.ok) {
            currentData = await resp.json();
            // 确保 weekly_schedule 是对象格式
            if (currentData.work && Array.isArray(currentData.work.weekly_schedule)) {
                const arr = currentData.work.weekly_schedule;
                const days = ['monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday', 'sunday'];
                const obj = {};
                days.forEach((d, i) => {
                    const item = arr[i] || { type: 'off', shift: 'off', name: '休息', time: '——' };
                    obj[d] = { type: item.type || 'off', shift: item.shift || item.type || 'off', name: item.name || '休息', time: item.time || '——' };
                });
                currentData.work.weekly_schedule = obj;
            }
            loaded = true;
            showToast('✅ 已加载 ' + SLOT_NAMES[slot]);
        } else {
            console.warn('⚠️ profile.json 不存在，使用内置默认值');
        }
    } catch (e) {
        console.warn('⚠️ 加载失败，使用内置默认值:', e);
    }

    if (!loaded) {
        // 🚀 使用内置默认值
        currentData = getDefaultProfile(slot);
        showToast('📋 使用内置默认值（' + SLOT_NAMES[slot] + '）');
    }

    originalData = JSON.parse(JSON.stringify(currentData));
    renderAll();
}

// ================================================================
//  🔄 恢复默认
// ================================================================
function confirmReset() {
    const name = SLOT_NAMES[currentSlot];
    if (confirm('⚠️ 确定将「' + name + '」恢复为内置默认值吗？\n当前所有修改将丢失！')) {
        currentData = getDefaultProfile(currentSlot);
        originalData = JSON.parse(JSON.stringify(currentData));
        renderAll();
        showToast('✅ 已恢复 ' + name + ' 为默认值');
    }
}

function renderAll() {
    renderSlotSelector();
    renderForm();
}

function renderSlotSelector() {
    const container = document.getElementById('slotSelector');
    container.innerHTML = '';
    SLOTS.forEach(slot => {
        const btn = document.createElement('button');
        btn.className = 'slot-btn' + (slot === currentSlot ? ' active' : '');
        btn.innerHTML = `<span class="emoji">${SLOT_EMOJI[slot]}</span> ${SLOT_NAMES[slot]}`;
        btn.onclick = () => {
            if (hasUnsavedChanges()) {
                if (confirm('有未保存的修改，确定切换吗？')) loadProfile(slot);
            } else {
                loadProfile(slot);
            }
        };
        container.appendChild(btn);
    });
}

function hasUnsavedChanges() {
    if (!currentData || !originalData) return false;
    return JSON.stringify(currentData) !== JSON.stringify(originalData);
}

            <div class="section-body">
                <textarea id="f-systemPrompt" rows="6" onchange="markDirty()">${d.systemPrompt || ''}</textarea>
                <div class="hint">⚠️ 修改 System Prompt 会影响 AI 的回复风格</div>
            </div>
        </div>
    `;
}

// ================================================================
//  交互函数
// ================================================================
function toggleSection(header) {
    const body = header.nextElementSibling;
    const arrow = header.querySelector('.arrow');
    body.classList.toggle('hidden');
    arrow.classList.toggle('open');
}

function markDirty() {}

function updateProbDisplay(sliderId, labelId) {
    const slider = document.getElementById(sliderId);
    const label = document.getElementById(labelId);
    if (slider && label) label.textContent = slider.value + '%';
    markDirty();
}

function addTag() {
    const input = document.getElementById('tag-input');
    const val = input.value.trim();
    if (!val) return;
    if (!currentData.personality.tags) currentData.personality.tags = [];
    if (!currentData.personality.tags.includes(val)) {
        currentData.personality.tags.push(val);
        renderForm();
        markDirty();
    }
    input.value = '';
}

function removeTag(index) {
    if (currentData.personality.tags) {
        currentData.personality.tags.splice(index, 1);
        renderForm();
        markDirty();
    }
}

function addKeyword(type) {
    const inputMap = {
        'np': 'np-input', 'na': 'na-input', 'hp': 'hp-input',
        'unlock': 'unlock-input', 'conf': 'conf-input'
    };
    const input = document.getElementById(inputMap[type]);
    const val = input.value.trim();
    if (!val) return;

    const kt = currentData.keyword_triggers;
    if (type === 'np') {
        if (!kt.normal_photo) kt.normal_photo = [{ keywords: [], probability: 0.5 }];
        if (!kt.normal_photo[0].keywords) kt.normal_photo[0].keywords = [];
        if (!kt.normal_photo[0].keywords.includes(val)) kt.normal_photo[0].keywords.push(val);
    } else if (type === 'na') {
        if (!kt.normal_audio) kt.normal_audio = { keywords: [], probability: 0.5 };
        if (!kt.normal_audio.keywords.includes(val)) kt.normal_audio.keywords.push(val);
    } else if (type === 'hp') {
        if (!kt.hidden_photo) kt.hidden_photo = [{ keywords: [], probability: 0.3 }];
        if (!kt.hidden_photo[0].keywords) kt.hidden_photo[0].keywords = [];
        if (!kt.hidden_photo[0].keywords.includes(val)) kt.hidden_photo[0].keywords.push(val);
    } else if (type === 'unlock') {
        if (!currentData.unlock_config) currentData.unlock_config = { enable: true, words: [] };
        if (!currentData.unlock_config.words.includes(val)) currentData.unlock_config.words.push(val);
    } else if (type === 'conf') {
        if (!currentData.special_rules) currentData.special_rules = { confession: { enable: true, keywords: [], probability: 0.6, fixed_reply_text: '' } };
        if (!currentData.special_rules.confession.keywords.includes(val)) currentData.special_rules.confession.keywords.push(val);
    }
    input.value = '';
    renderForm();
    markDirty();
}

function removeKeyword(type, index) {
    const kt = currentData.keyword_triggers;
    if (type === 'np' && kt.normal_photo?.[0]?.keywords) {
        kt.normal_photo[0].keywords.splice(index, 1);
    } else if (type === 'na' && kt.normal_audio?.keywords) {
        kt.normal_audio.keywords.splice(index, 1);
    } else if (type === 'hp' && kt.hidden_photo?.[0]?.keywords) {
        kt.hidden_photo[0].keywords.splice(index, 1);
    } else if (type === 'unlock' && currentData.unlock_config?.words) {
        currentData.unlock_config.words.splice(index, 1);
    } else if (type === 'conf' && currentData.special_rules?.confession?.keywords) {
        currentData.special_rules.confession.keywords.splice(index, 1);
    }
    renderForm();
    markDirty();
}

function openShiftPicker(dayKey) {
    const types = ['off', 'morning', 'mid', 'night', 'allday', 'sing', 'double'];
    const names = ['休息', '早班', '中班', '晚班', '全天候', '驻唱', '混合班'];
    const options = types.map((t, i) => `${i+1}.${names[i]}`).join(' ');
    const input = prompt('选择班次（输入编号）：\n' + options);
    if (!input) return;
    const idx = parseInt(input) - 1;
    if (idx < 0 || idx >= types.length) return;
    const type = types[idx];
    const shift = SHIFT_OPTIONS[type];
    if (!currentData.work) currentData.work = {};
    if (!currentData.work.weekly_schedule) currentData.work.weekly_schedule = getDefaultSchedule();
    currentData.work.weekly_schedule[dayKey] = {
        type: type,
        shift: type,
        name: shift.name,
        time: shift.time
    };
    renderForm();
    markDirty();
    showToast('✅ 已更新 ' + dayKey);
}

// ================================================================
//  保存数据
// ================================================================
function collectFormData() {
    if (!currentData) return;

    currentData.basic = currentData.basic || {};
    currentData.basic.name = document.getElementById('f-name').value;
    currentData.basic.gender = document.getElementById('f-gender').value;
    currentData.basic.birthday = document.getElementById('f-birthday').value;
    currentData.basic.height = parseInt(document.getElementById('f-height').value) || 0;
    currentData.basic.weight = parseInt(document.getElementById('f-weight').value) || 0;
    currentData.basic.bust = document.getElementById('f-bust').value;
    currentData.basic.shoe = document.getElementById('f-shoe').value;

    currentData.personality = currentData.personality || {};
    currentData.personality.summary = document.getElementById('f-summary').value;
    currentData.personality.style_detail = document.getElementById('f-style').value;
    currentData.personality.call_user = document.getElementById('f-call_user').value;
    currentData.personality.self_call = document.getElementById('f-self_call').value;

    currentData.life = currentData.life || {};
    currentData.life.habits = document.getElementById('f-habits').value;
    currentData.life.places = document.getElementById('f-places').value;
    currentData.life.food_preference = document.getElementById('f-food').value;

    currentData.work = currentData.work || {};
    currentData.work.workplace = document.getElementById('f-workplace').value;
    currentData.work.position = document.getElementById('f-position').value;
    currentData.work.work_addr = document.getElementById('f-workaddr').value;
    currentData.work.district = document.getElementById('f-district').value;
    currentData.work.address = document.getElementById('f-address').value;
    currentData.work.commute = document.getElementById('f-commute').value;

    const kt = currentData.keyword_triggers || {};
    if (kt.normal_photo?.[0]) {
        kt.normal_photo[0].probability = parseInt(document.getElementById('np-prob').value) / 100;
    }
    if (kt.normal_audio) {
        kt.normal_audio.probability = parseInt(document.getElementById('na-prob').value) / 100;
    }
    if (kt.hidden_photo?.[0]) {
        kt.hidden_photo[0].probability = parseInt(document.getElementById('hp-prob').value) / 100;
    }

    currentData.unlock_config = currentData.unlock_config || {};
    currentData.unlock_config.enable = document.getElementById('unlock-enable').checked;

    currentData.special_rules = currentData.special_rules || {};
    currentData.special_rules.confession = currentData.special_rules.confession || {};
    currentData.special_rules.confession.enable = document.getElementById('conf-enable').checked;
    currentData.special_rules.confession.probability = parseInt(document.getElementById('conf-prob').value) / 100;
    currentData.special_rules.confession.fixed_reply_text = document.getElementById('conf-reply').value;

    currentData.global_cool_downs = currentData.global_cool_downs || {};
    currentData.global_cool_downs.normal_photo_seconds = parseInt(document.getElementById('gcd-photo').value) || 120;
    currentData.global_cool_downs.normal_audio_seconds = parseInt(document.getElementById('gcd-audio').value) || 30;
    currentData.global_cool_downs.hidden_photo_hours = parseInt(document.getElementById('gcd-hidden').value) || 3;
    currentData.global_cool_downs.hidden_audio_hours = parseInt(document.getElementById('gcd-hidden').value) || 3;
    currentData.global_cool_downs.cross_slot_shared = document.getElementById('gcd-cross').checked;

    currentData.systemPrompt = document.getElementById('f-systemPrompt').value;
}

function saveData() {
    collectFormData();

    const btn = document.getElementById('saveBtn');
    btn.textContent = '⏳ 生成中...';
    btn.disabled = true;

    try {
        const json = JSON.stringify(currentData, null, 2);
        const blob = new Blob([json], { type: 'application/json' });
        const url = URL.createObjectURL(blob);

        const a = document.createElement('a');
        a.href = url;
        a.download = currentSlot + '/profile.json';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);

        originalData = JSON.parse(JSON.stringify(currentData));

        btn.textContent = '✅ 已下载';
        btn.classList.add('saved');
        setTimeout(() => {
            btn.textContent = '💾 保存';
            btn.classList.remove('saved');
            btn.disabled = false;
        }, 2000);

        showToast('✅ 已下载 ' + SLOT_NAMES[currentSlot] + ' 的 profile.json');
    } catch (e) {
        btn.textContent = '💾 保存';
        btn.disabled = false;
        showToast('❌ 保存失败: ' + e.message);
        console.error('保存失败:', e);
    }
}

// ================================================================
//  初始化
// ================================================================
document.addEventListener('DOMContentLoaded', () => {
    loadProfile('a');
});

// 暴露全局函数
window.toggleSection = toggleSection;
window.addTag = addTag;
window.removeTag = removeTag;
window.addKeyword = addKeyword;
window.removeKeyword = removeKeyword;
window.openShiftPicker = openShiftPicker;
window.updateProbDisplay = updateProbDisplay;
window.markDirty = markDirty;
window.saveData = saveData;
window.goBack = goBack;
window.loadProfile = loadProfile;
window.confirmReset = confirmReset;
window.renderForm = renderForm;

console.log('✏️ 人设修改器已加载（内置默认值）');
console.log('📌 修改后点击「保存」下载 profile.json');
console.log('📌 点击「恢复默认」可重置为内置默认值');
</script>
