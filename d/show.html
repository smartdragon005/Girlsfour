<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Girls4 · 角色档案</title>
<link rel="stylesheet" href="../common.css">
<style>
/* ========== 深蓝夜空主题 颜色变量（全局统一） ========== */
:root {
  --bg: #141a24;            /* 页面底色 深蓝夜空 */
  --bg-elev: #1A1F2C;       /* 顶部/底部 抬起层 */
  --bg-card: #232A3B;       /* 卡片 次抬起层 */
  --bg-inner: #1E2433;      /* 卡片内嵌面板 */
  --bg-chip: #2A3144;       /* 标签、小色块 */
  --bg-soft: rgba(59, 111, 229, 0.16);   /* 蓝色柔光（选中背景） */
  --b: #2A3144;             /* 普通边框 */
  --b2: #3A445F;            /* 强调边框 */
  --ba: #3B6FE5;            /* 主蓝（强调色/选中） */
  --t: #E8ECF4;             /* 主文字 白 */
  --t2: #A3ACBE;            /* 次文字 灰蓝 */
  --tm: #6B7388;            /* 提示文字 灰 */
  --ok: #34C759;            /* 绿色（成功/休息/达标） */
  --w: #FF9F0A;             /* 黄色（警告/早班/概率） */
  --p: #EC4899;             /* 粉色（驻唱/白洁色） */
  --pu: #8B5CF6;            /* 紫色（晚班） */
  --danger: #FF453A;        /* 红色（危险/删除） */
  --r: 0;  --r2: 0;  --r3: 0;  --rf: 50%;
  --font: "MiSans", "MiSans VF", -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  --safe-top: env(safe-area-inset-top, 28px);
  --safe-bottom: env(safe-area-inset-bottom, 32px);
}

/* ========== 全局滚动条隐藏（手机端无滑块，手指滑动有效） ========== */
* { box-sizing: border-box; margin: 0; padding: 0; max-width: 100%;
  -webkit-tap-highlight-color: transparent;
  tap-highlight-color: transparent;
}
html, body {
            display: flex; justify-content: center; align-items: stretch; width: 100%; height: 100%; background: #ffffff; color: var(--t); font-family: var(--font); overflow: hidden;
            -webkit-tap-highlight-color: transparent;
            tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
}
body {
            display: flex; justify-content: center; align-items: stretch;
  
  overflow: hidden;
  position: relative;
}
/* 全局按钮触摸优化 */
button, a, .clickable {
  -webkit-tap-highlight-color: transparent;
  tap-highlight-color: transparent;
  -webkit-touch-callout: none;
  outline: none;
  -webkit-appearance: none;
  appearance: none;
}
button::before, button::after,
a::before, a::after,
.clickable::before, .clickable::after {
  -webkit-tap-highlight-color: transparent;
  tap-highlight-color: transparent;
}
button:focus, a:focus,
button:active, a:active {
  outline: none;
  -webkit-tap-highlight-color: transparent;
}
/* 安全区域白色不透明背景 */
body::before {
  content: '';
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: var(--safe-top);
  background: #ffffff;
  z-index: 9999;
  pointer-events: none;
}
body::after {
  content: '';
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: var(--safe-bottom);
  background: #ffffff;
  z-index: 9999;
  pointer-events: none;
}
.scroll-hide {
  overflow-y: auto; overflow-x: hidden;
  -webkit-overflow-scrolling: touch;     /* iOS 惯性滑动 */
  scrollbar-width: none;                 /* Firefox */
  -ms-overflow-style: none;              /* 旧 Edge */
}
.scroll-hide::-webkit-scrollbar { width: 0 !important; height: 0 !important; display: none !important; }  /* Chrome/Safari/安卓 */

/* ========== 页面容器 ========== */
.app {
  max-width: 480px;
  margin: 0 auto;
  height: 100%;
  background: var(--bg);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  width: 100%;
  border-radius: 0 !important;
}

/* ========== 顶部栏 ========== */
.topbar {
  display: flex; justify-content: space-between; align-items: flex-start;
  padding: 16px 18px;
  background: var(--bg-elev);
  border-bottom: 1px solid var(--b);
  flex-shrink: 0;
  z-index: 10;
  backdrop-filter: blur(10px);
}
.tl { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.tl h1 {
  font: 700 20px/28px var(--font);
  color: var(--t);
  display: flex; align-items: center; gap: 8px;
}
.tl h1 .logo {
  width: 30px; height: 30px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  background: linear-gradient(135deg, #F59E0B, var(--ba));
  font-size: 16px; color: #fff; flex-shrink: 0;
}
.tl .sub { font: 400 12px/18px var(--font); color: var(--tm); }
.tr { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
.icon-btn {
  width: 44px; height: 44px; border-radius: 50%;
  background: #f0f2f5;
  border: 1px solid #c8ccd4;
  color: #333; font-size: 20px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: 0.18s;
  flex-shrink: 0; user-select: none;
}
.icon-btn:hover { color: var(--ba); border-color: var(--ba); background: #fff; }
.icon-btn:active { transform: scale(0.95); }

/* ========== Loading 态 ========== */
.loading {
  text-align: center; padding: 60px 20px;
  color: var(--tm); font: 400 13px/19px var(--font);
}
.loading .spinner {
  display: inline-block;
  width: 28px; height: 28px;
  border: 2.5px solid var(--b);
  border-top-color: var(--ba);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin-bottom: 14px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading .auto-timer {
  font-size: 12px; color: var(--t3); margin-bottom: 10px;
}
.loading .auto-timer b { color: var(--ba); font-weight: 700; }
.loading .f-bt {
  margin-top: 14px;
  padding: 13px 20px;
  font: 700 14px/20px var(--font);
  color: #fff;
  background: linear-gradient(135deg, #ec4899 0%, #f97316 100%);
  border: none; border-radius: 10px;
  box-shadow: 0 8px 24px rgba(236,72,153,0.35);
  cursor: pointer;
  animation: pulse 1.6s ease-in-out infinite;
}
@keyframes pulse {
  0%,100% { box-shadow: 0 8px 24px rgba(236,72,153,0.35); transform: scale(1); }
  50%     { box-shadow: 0 10px 30px rgba(236,72,153,0.55); transform: scale(1.03); }
}
.loading .tip {
  margin-top: 6px;
  font-size: 11px;
  padding: 8px 12px;
  background: var(--bg-inner);
  border: 1px dashed var(--b2);
  border-radius: var(--r2);
  display: inline-block;
  max-width: 90%;
  word-break: break-all;
}
.loading .tip b { color: var(--ba); }

/* ========== 4等分 人设Tab - 直线分隔风格 ========== */
.tabs {
  display: grid; grid-template-columns: repeat(4, 1fr);
  gap: 0;
  padding: 0;
  border: none;
  border-bottom: 1px solid var(--b);
}
.tab {
  padding: 12px 4px;
  border: none;
  border-right: 1px solid var(--b);
  border-radius: 0;
  background: var(--bg-card);
  text-align: center;
  cursor: pointer;
  transition: 0.18s;
  user-select: none;
  margin: 0 -1px;
}
.tab:last-child { border-right: none; }
.tab:hover { background: var(--bg-inner); }
.tab.active {
  background: var(--bg-soft);
  border-bottom: 2px solid var(--ba);
  box-shadow: none;
}
.tab .e { font-size: 22px; display: block; margin-bottom: 4px; }
.tab .n { font: 600 12px/18px var(--font); color: var(--t2); }
.tab.active .n { color: var(--t); font-weight: 700; }

/* ========== 滚动内容区 ========== */
.content {
  padding: 0 0 16px;
  display: flex; flex-direction: column; gap: 12px;
}


/* contentState flex布局支持 */
#contentState > .girls4-banner { flex-shrink: 0; }
#contentState > .tabs { flex-shrink: 0; box-sizing: border-box; }
#contentState > .content { flex: 1; min-height: 0; overflow-y: auto; }
#loadingState { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
/* ========== 资料卡（对应 show.html 的 profile-card） - 直线分隔风格 ========== */
.card {
  background: var(--bg-card);
  border: none;
  border-top: 1px solid var(--b);
  border-bottom: 1px solid var(--b);
  border-radius: 0;
  padding: 16px;
}
.field {
  display: flex;
  padding: 9px 0;
  font: 400 13px/20px var(--font);
  border-bottom: 1px dashed var(--b);
  gap: 12px;
  align-items: flex-start;
}
.field:last-child { border-bottom: none; }
.field .l {
  color: var(--tm);
  min-width: 76px;
  flex-shrink: 0;
  font-weight: 500;
  padding-top: 2px;
}
.field .v {
  color: var(--t);
  font-weight: 500;
  word-break: break-word;
  flex: 1;
  line-height: 1.6;
}
.field .v.av {
  display: flex; align-items: center; gap: 14px;
  flex-wrap: wrap;
}
.av-img {
  width: 60px; height: 60px; border-radius: 50%;
  background: linear-gradient(135deg, #10B981, var(--ba));
  display: flex; align-items: center; justify-content: center;
  font-size: 30px; color: #fff;
  border: 2px solid var(--b2);
  flex-shrink: 0;
}
.av-img.cA { background: linear-gradient(135deg, #EC4899, #8B5CF6); }
.av-img.cB { background: linear-gradient(135deg, #6366F1, #06B6D4); }
.av-img.cC { background: linear-gradient(135deg, #10B981, #3B6FE5); }
.av-img.cD { background: linear-gradient(135deg, #F59E0B, #EF4444); }
.tag {
  display: inline-block;
  background: var(--bg-chip);
  color: var(--t2);
  padding: 3px 12px;
  border-radius: 10px;
  font: 500 11px/16px var(--font);
}
.tag.work {
  background: var(--bg-soft);
  color: var(--ba);
  border: 1px solid rgba(59, 111, 229, 0.3);
}
.pill {
  display: inline-block;
  padding: 3px 9px;
  margin: 0 5px 4px 0;
  background: var(--bg-chip);
  border-radius: 10px;
  font: 500 11px/16px var(--font);
  color: var(--t2);
}

/* ========== 排班卡 ========== */
.s-head {
  display: flex; justify-content: space-between; align-items: center;
  font: 700 14px/22px var(--font); color: var(--t);
  margin-bottom: 12px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--b);
}
.s-head .week {
  font: 600 10px/14px var(--font);
  background: var(--bg-soft);
  color: var(--ba);
  padding: 3px 10px;
  border-radius: var(--rf);
  border: 1px solid rgba(59, 111, 229, 0.3);
  flex-shrink: 0;
}
.sg { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
.sc {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  padding: 8px 2px;
  background: var(--bg-inner);
  border-radius: 10px;
  border: 1px solid var(--b);
}
.sc.dow {
  background: transparent; border: none; padding: 0 0 3px;
  font: 700 10px/14px var(--font); color: var(--tm);
}
.sc .p {
  width: 100%; text-align: center;
  padding: 3px 0;
  border-radius: 10px;
  font: 700 10px/14px var(--font);
}
.sc .t { font: 400 8px/12px var(--font); color: var(--tm); text-align: center; line-height: 1.35; }
.p-m { background: rgba(255, 159, 10, 0.15); color: #FFB547; }
.p-i { background: rgba(59, 111, 229, 0.15); color: #7FABFF; }
.p-n { background: rgba(139, 92, 246, 0.15); color: #B794F4; }
.p-o { background: rgba(52, 199, 89, 0.15); color: #6EE7B7; }
.p-s { background: rgba(236, 72, 153, 0.15); color: #F9A8D4; }
.p-d { background: rgba(255, 159, 10, 0.15); color: #FFB547; }
.p-f { background: rgba(59, 111, 229, 0.15); color: #7FABFF; }

.s-legend {
  display: flex; flex-wrap: wrap; gap: 8px;
  margin-top: 10px;
  padding: 8px 10px;
  background: var(--bg-inner);
  border-radius: var(--r);
  border: 1px solid var(--b);
}
.lg {
  display: flex; align-items: center; gap: 4px;
  font: 500 10px/14px var(--font); color: var(--t2);
}
.lg .dot { width: 10px; height: 10px; border-radius: 50%; }
.lg .dot.m { background: rgba(255, 159, 10, 0.45); }
.lg .dot.i { background: rgba(59, 111, 229, 0.45); }
.lg .dot.n { background: rgba(139, 92, 246, 0.45); }
.lg .dot.o { background: rgba(52, 199, 89, 0.45); }
.lg .dot.s { background: rgba(236, 72, 153, 0.45); }

/* ========== 系统参数卡 ========== */
.sys-title {
  font: 600 13px/20px var(--font);
  color: var(--t);
  margin-bottom: 10px;
  display: flex; align-items: center; gap: 6px;
}
.sys-title .ro {
  margin-left: auto;
  font: 600 10px/14px var(--font);
  color: var(--tm);
  background: var(--bg-chip);
  padding: 2px 9px;
  border-radius: 0;
}
.sys-title .ro + .ro { margin-left: 5px; }
.sys-title .ro.realtime {
  background: rgba(52,199,89,0.18);
  color: #6EE7B7;
}
/* 小组分隔标题 */
.sys-sec {
  grid-column: 1 / -1;
  margin: 12px -16px 4px;
  padding: 6px 16px 4px;
  font: 700 11px/16px var(--font);
  color: var(--ba);
  letter-spacing: 0.3px;
  border-top: 1px solid var(--b);
  display: flex;
  align-items: center;
  gap: 6px;
}
.sys-sec:first-of-type {
  margin-top: 2px;
  border-top: none;
}
.sys-sec .ic { filter: grayscale(20%); }
.sysg {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 4px 16px;
}
.sysi {
  display: flex; justify-content: space-between;
  padding: 5px 0;
  font: 400 11px/16px var(--font);
  border-bottom: 1px dashed var(--b);
  align-items: center;
}
.sysi:nth-last-child(-n+2) { border-bottom: none; }
.sysi .k { color: var(--tm); font-size: 11px; font-weight: 400; }
.sysi .v { color: var(--ok); font-weight: 600; font-size: 11px; }
.sysi .v.pct-w { color: var(--w); }
.sysi .v.pct-b { color: var(--ba); }
.sysi .v.city { color: var(--ok); }

/* ========== 新增：Girls4 总Banner + 人设Hero大图 ========== */
.girls4-banner {
  min-height: 220px;
  border-radius: var(--r3);
  margin: 0;
  padding: 26px 22px;
  background: linear-gradient(135deg, rgba(236,72,153,0.55) 0%, rgba(139,92,246,0.45) 45%, rgba(20,24,33,0.95) 100%), var(--bg-inner);
  background-size: cover;
  background-position: center;
  border: 1px solid var(--b2);
  display: flex; flex-direction: column; justify-content: flex-end;
  position: relative;
  overflow: hidden;
}
.girls4-banner .gb-hd {
  position: absolute; top: 16px; right: 16px;
  display: flex; gap: 5px;
}
.girls4-banner .gb-hd .ch {
  width: 30px; height: 30px; border-radius: 50%;
  background: rgba(255,255,255,0.2);
  backdrop-filter: blur(3px);
  border: 1.5px solid rgba(255,255,255,0.3);
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; color: #fff;
}
.girls4-banner .gb-t {
  font: 800 30px/40px var(--font);
  color: #fff;
  letter-spacing: 2px;
  text-shadow: 0 3px 10px rgba(0,0,0,0.65);
  margin-bottom: 4px;
  display: flex; align-items: center; gap: 10px;
}
.girls4-banner .gb-t .logo {
  width: 44px; height: 44px; border-radius: 14px;
  background: rgba(255,255,255,0.22);
  backdrop-filter: blur(5px);
  border: 1.5px solid rgba(255,255,255,0.3);
  display: flex; align-items: center; justify-content: center;
  font-size: 23px;
}
.girls4-banner .gb-s {
  font: 400 13px/20px var(--font);
  color: rgba(255,255,255,0.85);
  text-shadow: 0 1px 4px rgba(0,0,0,0.65);
  max-width: 90%;
}

/* 人设专属大图Hero（资料卡顶部） */
.profile-hero {
  min-height: 190px;
  border-radius: 10px;
  margin: 0;
  padding: 22px 18px;
  border: none;
  border-top: 1px solid var(--b2);
  border-bottom: 1px solid var(--b2);
  background: linear-gradient(135deg, rgba(59,111,229,0.45) 0%, rgba(20,24,33,0.94) 100%), var(--bg-inner);
  background-size: cover;
  background-position: center;
  display: flex; flex-direction: column; justify-content: flex-end;
  align-items: flex-start;
  position: relative;
  overflow: hidden;
}
.profile-hero.phA { background: linear-gradient(135deg, rgba(236,72,153,0.5) 0%, rgba(139,92,246,0.35) 55%, rgba(20,24,33,0.94) 100%), var(--bg-inner); background-size:cover,cover,auto; background-position:center top; }
.profile-hero.phB { background: linear-gradient(135deg, rgba(99,102,241,0.5) 0%, rgba(6,182,212,0.3) 55%, rgba(20,24,33,0.94) 100%), var(--bg-inner); background-size:cover,cover,auto; background-position:center top; }
.profile-hero.phC { background: linear-gradient(135deg, rgba(16,185,129,0.48) 0%, rgba(59,111,229,0.35) 55%, rgba(20,24,33,0.94) 100%), var(--bg-inner); background-size:cover,cover,auto; background-position:center top; }
.profile-hero.phD { background: linear-gradient(135deg, rgba(245,158,11,0.48) 0%, rgba(239,68,68,0.35) 55%, rgba(20,24,33,0.94) 100%), var(--bg-inner); background-size:cover,cover,auto; background-position:center top; }
/* Banner图片容器 - 使用img标签实现精准居中 */
.profile-hero .ph-banner-img {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center center;
  z-index: 0;
  pointer-events: none;
}
.profile-hero::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: linear-gradient(180deg, rgba(20,24,33,0.3) 0%, rgba(20,24,33,0.7) 50%, rgba(20,24,33,0.92) 100%);
  z-index: 1;
  pointer-events: none;
}
.profile-hero > *:not(.ph-banner-img) {
  position: relative;
  z-index: 2;
}

.profile-hero .ph-top {
  position: absolute; top: 15px; right: 15px;
  display: flex; gap: 6px; align-items: center;
}
.profile-hero .ph-top .ptg {
  background: rgba(0,0,0,0.4);
  backdrop-filter: blur(4px);
  border: 1px solid rgba(255,255,255,0.22);
  color: #fff;
  padding: 3px 9px;
  border-radius: var(--rf);
  font: 600 10px/14px var(--font);
}
.profile-hero .ph-row {
  display: flex; align-items: flex-end; gap: 12px;
  width: 100%;
}
.profile-hero .ph-av {
  width: 68px; height: 68px; border-radius: 50%;
  background: rgba(255,255,255,0.15);
  backdrop-filter: blur(5px);
  border: 2px solid rgba(255,255,255,0.4);
  display: flex; align-items: center; justify-content: center;
  font-size: 32px; color: #fff;
  flex-shrink: 0;
  margin-bottom: 3px;
}
.profile-hero .ph-tx { flex: 1; min-width: 0; }
.profile-hero .ph-tx .ph-name {
  font: 800 24px/34px var(--font);
  color: #fff;
  text-shadow: 0 2px 8px rgba(0,0,0,0.6);
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 3px;
}
.profile-hero .ph-tx .ph-bio {
  font: 400 12px/18px var(--font);
  color: rgba(255,255,255,0.88);
  text-shadow: 0 1px 3px rgba(0,0,0,0.6);
  max-width: 92%;
}

.profile-hero .ph-tx .ph-name .tg {
  background: rgba(255,255,255,0.22);
  backdrop-filter: blur(4px);
  border: 1px solid rgba(255,255,255,0.3);
  padding: 3px 10px;
  border-radius: var(--rf);
  font: 600 10px/14px var(--font);
}


/* ========== 底部条 ========== */
.foot {
  margin-top: 2px;
  padding: 12px 16px;
  background: var(--bg-inner);
  border-radius: 10px;
  border: 1px dashed var(--b2);
  font: 400 11px/16px var(--font);
  color: var(--tm);
  text-align: center;
  display: flex; align-items: center; justify-content: center; gap: 5px;
  flex-wrap: wrap;
}
.foot code {
  background: var(--bg-chip);
  color: #7FABFF;
  padding: 2px 7px;
  border-radius: 10px;
  font: 600 10px/14px ui-monospace, Consolas, monospace;
}

/* ========== Toast ========== */
.toast {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: var(--ba);
  color: #fff;

/* ========================================================

   ======================================================== */

const PROFILE_PATHS = ['../a/profile.json','../b/profile.json','../c/profile.json','../d/profile.json'];
const CITY_PATH = '../d/data.json';

let STATE = { profiles: [], city: null, currentId: null, isLoading: false, usingFallback: false };

/* ========== 工具：生成头像DOM（终极稳定方案 v3，与主界面 index.html 一致）
   兼容 file:// / http:// / Android WebView；失败自动兜底 emoji ========== */
function getAvatarPathOf(p) {
  // 当前页面路径：/all/d/show.html
  // profile.json 里 avatar_path 一般写成 "./a/img/other/avatar.jpg"（相对于all/）
  // 所以要先剥掉所有前缀，最后统一加上：d卡用 "./img/..."（同目录），其他卡用 "../{slot}/img/..."（退回all/再进去）
  const slot = p.slot || 'a';
  const defaultPath = (slot === 'd' ? './img/other/avatar.jpg' : `../${slot}/img/other/avatar.jpg`);
  let raw = '';
  try { raw = (p.basic && p.basic.avatar_path ? p.basic.avatar_path : '').toString().trim(); } catch(e) {}
  if (!raw) return defaultPath;
  // 剥掉所有前缀变体：all/ ./all/ /all/ ./ / 等
  raw = raw.replace(/^[/\.]*all\//i, '').replace(/^[.\/]+/, '');
  // 此时 raw 形如："a/img/other/avatar.jpg"（相对all/根目录）
  const expectedPrefix = slot + '/';
  if (!raw.toLowerCase().startsWith(expectedPrefix.toLowerCase())) return defaultPath;
  // show.html 在 all/d/ 下，要定位到 all/{slot}/...
  // d卡路径：all/d/img/... → 在 show.html 中用 "./img/..."
  // 非d卡路径：all/{a,b,c}/img/... → 在 show.html 中需先".."回到all/，再进 {slot}
  if (slot === 'd') {
    // 剥掉前缀 "d/"，剩下的就是相对路径
    const sub = raw.substring(expectedPrefix.length); // "img/other/avatar.jpg"
    return './' + sub;
  } else {
    // 非d卡：raw 已经是 "{slot}/img/other/avatar.jpg"，前面加"../"退回all目录
    return '../' + raw;
  }
}
function createAvatarEl(p, sizeHint) {
  // sizeHint: 's'=小(默认36px圆形) / 'm'=中(64px) / 'l'=大(100px+) / 留空就自适应父容器

  emNode.style.cssText = `${emSize}display:inline-flex;align-items:center;justify-content:center;width:100%;height:100%;`;
  wrapper.appendChild(emNode);

  try {

  } catch(e) {}
  return wrapper;
}

/* ========== 工具：年龄 + 星座 ========== */
function calcAge(birthday) {
  if (!birthday) return '?';
  const t = new Date(), b = new Date(birthday);
  let a = t.getFullYear() - b.getFullYear();
  const m = t.getMonth() - b.getMonth();
  if (m < 0 || (m === 0 && t.getDate() < b.getDate())) a--;
  return a;
}
function calcZodiac(birthday) {
  if (!birthday) return '';
  const d = new Date(birthday), m = d.getMonth() + 1, day = d.getDate();
  const signs = [[1,20,'水瓶座'],[2,19,'双鱼座'],[3,21,'白羊座'],[4,20,'金牛座'],[5,21,'双子座'],[6,22,'巨蟹座'],[7,23,'狮子座'],[8,23,'处女座'],[9,23,'天秤座'],[10,24,'天蝎座'],[11,23,'射手座'],[12,22,'摩羯座']];
  for (let i = signs.length - 1; i >= 0; i--) {
    if (m > signs[i][0] || (m === signs[i][0] && day >= signs[i][1])) return signs[i][2];
  }
  return '摩羯座';
}
function WEEK_CN() { return ['周一','周二','周三','周四','周五','周六','周日']; }

      ][i];

/* ========== 读取JSON（5个并行，每请求5秒超时 + 总超时） ========== */
async function loadData(showMsg=false) {
  if (STATE.isLoading) return;
  STATE.isLoading = true;

  // 总超时 5.5 秒：Promise.race 保证不管 fetch 有多卡，一定能有返回而不是永挂
  const totalTimeout = new Promise((_, reject) => setTimeout(() => reject(new Error('总超时5.5秒')), 5500));

  try {
    const results = await Promise.race([
      Promise.all([
        ...PROFILE_PATHS.map(p => safeFetch(p)),
        safeFetch(CITY_PATH)
      ]),
      totalTimeout
    ]);
    STATE.profiles = results.slice(0, 4);
    STATE.city = results[4];
    STATE.usingFallback = false;
    if (showMsg) showToast('✅ 数据刷新成功 · 4位人设 + 9宫格世界观', 'ok');
    return STATE;
  } catch(e) {
    console.error('[Girls4] 加载失败/超时，切换Fallback:', e);
    const fb = loadFallback();
    STATE.profiles = fb.profiles;
    STATE.city = fb.city;
    return STATE;
  } finally {
    STATE.isLoading = false;
  }
}
async function safeFetch(url) {
  // 单个 fetch 包 5 秒超时（安卓WebView下fetch(file://)永远不resolve/不reject的问题）
  const timeoutPromise = new Promise((_, reject) => setTimeout(() => reject(new Error('单请求超时5秒: '+url)), 5000));
  try {
    const fetchUrl = location.protocol === 'file:' ? url : url + '?t=' + Date.now();
    const r = await Promise.race([fetch(fetchUrl), timeoutPromise]);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return await r.json();
  } catch (e) {
    throw e;
  }
}

/* ========== 手点/自动 强制兜底入口（用户能主动触发） ========== */

  // ========== 系统参数（如实读取profile.json + 兜底值，与index.html运行时保持一致） ==========
  const DEFAULT_CFG = {

  // 简易版 getPersonaParam（与 index.html 逻辑一致：没配置就用兜底）
  const readPath = (obj, path) => {

  const cityName  = STATE.city ? (STATE.city.city || '舒心市') : '舒心市';

  const slotPetMap = {a:DEFAULT_CFG.petA, b:DEFAULT_CFG.petB, c:DEFAULT_CFG.petC, d:DEFAULT_CFG.petD};
  const callUser   = g('personality.call_user', slotPetMap[p.slot] || '宝贝');

function getWeekNumber() {
  const t = new Date();
  const f = new Date(t.getFullYear(), 0, 1);
  return Math.ceil((((t - f) / 86400000) + f.getDay() + 1) / 7);
}

function switchTo(slot) {
  if (slot === STATE.currentId) return;
  renderDetail(slot);
  document.getElementById('roleContent').scrollTop = 0;
}

/* ========== 渲染入口 ========== */
function renderAll() {
  if (!STATE.profiles.length) return;

  renderTabs();
  STATE.currentId = STATE.profiles[0].slot;
  renderDetail(STATE.currentId);
  document.getElementById('loadingState').style.display = 'none';
  document.getElementById('contentState').style.display = 'flex';
  console.log(`✅ Girls4 加载完成：${STATE.profiles.length}位人设${STATE.usingFallback?'（后备示例数据）':''}`);
}

async function reloadData() {
  await loadData(true);
  const cur = STATE.currentId;
  renderAll();
  if (cur && STATE.profiles.find(p => p.slot === cur)) switchTo(cur);
}

/* ========== Toast ========== */
let _tt = null;
function showToast(msg, type='info') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast ' + (type==='ok'?'ok':type==='err'?'err':'');
  void el.offsetWidth;
  el.classList.add('show');
  clearTimeout(_tt);
  _tt = setTimeout(() => el.classList.remove('show'), 2600);
}
function tryClose() {
  // 优先使用历史记录返回（手机返回键也能工作）
  if (window.history.length > 1) {
    window.history.back();
  } else {
    location.href = '../index.html';
  }
}

/* ========== 手势滑动退出功能 ========== */
(function() {
  let startX = 0, startY = 0, currentX = 0, currentY = 0;
  let isSwiping = false;
  const SWIPE_THRESHOLD = 80;
  const EDGE_ZONE = 30;
  
  document.addEventListener('touchstart', function(e) {
    const touch = e.touches[0];
    startX = touch.clientX;
    startY = touch.clientY;
    currentX = startX;
    currentY = startY;
    isSwiping = true;
    if (startX < EDGE_ZONE) {
      e.preventDefault();
    }
  }, { passive: false });
  
  document.addEventListener('touchmove', function(e) {
    if (!isSwiping) return;
    const touch = e.touches[0];
    currentX = touch.clientX;
    currentY = touch.clientY;
    if (startX < EDGE_ZONE && currentX > startX) {
      e.preventDefault();
    }
  }, { passive: false });
  
  document.addEventListener('touchend', function() {
    if (!isSwiping) return;
    isSwiping = false;
    const deltaX = currentX - startX;
    const deltaY = abs(currentY - startY);
    if (startX < EDGE_ZONE && deltaX > SWIPE_THRESHOLD && deltaY < 100) {
      showToast('← 返回主界面', 'info');
      setTimeout(() => {
        tryClose();
      }, 200);
    }
  });
})();


/* ========== 对齐右下角返回按钮到右上角按钮 ========== */
function alignBackButton() {
  const btn = document.querySelector('.back-floating');
  const topBtns = document.querySelectorAll('.tr .icon-btn');
  const topBackBtn = topBtns[1];
  if (btn && topBackBtn) {
    const rect = topBackBtn.getBoundingClientRect();
    const btnWidth = 44;
    const centerX = rect.left + rect.width / 2;
    const rightOffset = window.innerWidth - centerX - btnWidth / 2;
    btn.style.right = rightOffset + 'px';
  }
}
window.addEventListener('load', alignBackButton);
window.addEventListener('resize', alignBackButton);
window.addEventListener('orientationchange', alignBackButton);
/* ========== Init ========== */
(async function init(){
  // 1. 启动倒计时显示（8秒）：setInterval 每秒-1
  let sec = 8;
  const secEl = document.getElementById('secVal');
  if (secEl) secEl.textContent = String(sec);
  window.__G4_COUNTDOWN_TID = setInterval(() => {
    sec = Math.max(0, sec - 1);
    if (secEl) secEl.textContent = String(sec);
  }, 1000);

  // 2. 8秒后：如果还在loading，自动强制 fallback（不管 fetch Promise卡没卡死，必进入内容页）
  setTimeout(() => {
    const loadingDiv = document.getElementById('loadingState');
    if (loadingDiv && loadingDiv.style.display !== 'none') {
      console.warn('[Girls4] 8秒自动兜底：fetch永远pending卡住，强制切fallback');
      FORCE_FALLBACK_G4(false);
    }
  }, 8000);

  // 3. 正常流程：loadData 已有 5.5 秒总超时兜底
  await loadData(false);
  if (!_G4_FORCE_DONE) {
    try { clearInterval(window.__G4_COUNTDOWN_TID); } catch(e) {}
    const at = document.getElementById('autoTimer');
    if (at) at.style.display = 'none';
    renderAll();
  }
})();
